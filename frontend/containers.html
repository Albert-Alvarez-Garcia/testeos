<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro — Gestión de Contenedores</title>
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="css/visor-admin-25d.css">
    <link rel="stylesheet" href="css/containers.css">
    <script src="js/shared/theme.js"></script>
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html" title="Ir al Inicio" class="logo-link">
                <img src="public/assets/logomagic.png" alt="Logo">
            </a>
            <span class="app-subtitle">Binder Pro — Gestión de Contenedores</span>
        </div>
    </header>

    <main>
        <div class="management-layout">
            
            <!-- Panel Izquierdo: Crear Nuevo Contenedor con Subcampos -->
            <section class="create-container-panel fantasy-panel">
                <h3 class="panel-title">Crear Nuevo Contenedor</h3>
                <form id="createContainerForm">
                    <div class="form-group">
                        <label>NOMBRE DEL CONTENEDOR</label>
                        <input type="text" id="containerName" placeholder="Ej. Binder Principal, Mazo Modern" required>
                    </div>

                    <div class="form-group">
                        <label>TIPO DE CONTENEDOR</label>
                        <select id="containerType" required>
                            <option value="">Selecciona un tipo...</option>
                            <option value="binder">Binder / Archivador</option>
                            <option value="deck">Mazo (Deck)</option>
                            <option value="box">Caja (Box)</option>
                        </select>
                    </div>

                    <!-- Subcampos para Binder -->
                    <div id="binderFields" class="dynamic-fields">
                        <div class="form-group">
                            <label>TAMAÑO DEL BINDER</label>
                            <select id="binderSize">
                                <option value="binder_s">Binder Pequeño (2x2 - 4 slots/pág)</option>
                                <option value="binder_m" selected>Binder Mediano (3x3 - 9 slots/pág)</option>
                                <option value="binder_xl">Binder Grande (4x3 - 12 slots/pág)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>NÚMERO DE PÁGINAS</label>
                            <input type="number" id="binderPages" value="40" min="1" max="200">
                        </div>
                    </div>

                    <!-- Subcampos para Deck (Mazo) -->
                    <div id="deckFields" class="dynamic-fields">
                        <div class="form-group">
                            <label>CAPACIDAD MAZO PRINCIPAL</label>
                            <input type="number" id="deckMainCapacity" value="60" min="1" max="250">
                        </div>
                        <div class="form-group">
                            <label>CAPACIDAD RESERVA (SIDEBOARD)</label>
                            <input type="number" id="deckSideboardCapacity" value="15" min="0" max="50">
                        </div>
                    </div>

                    <!-- Subcampos para Box (Caja) -->
                    <div id="boxFields" class="dynamic-fields">
                        <div class="form-group">
                            <label>CAPACIDAD MÁXIMA DE CARTAS</label>
                            <input type="number" id="boxCapacity" value="1000" min="1" max="5000">
                        </div>
                    </div>

                    <button type="submit" class="btn-fantasy btn-submit">Guardar Contenedor</button>
                </form>
            </section>

            <!-- Panel Derecho: Listado de Contenedores Existentes -->
            <section class="containers-list-container fantasy-panel">
                <div class="list-header">
                    <h3 class="panel-title">📦 Contenedores Existentes</h3>
                    
                    <select id="filterContainerType" class="list-filter">
                        <option value="all">Todos los tipos</option>
                        <option value="binder">Binders</option>
                        <option value="deck">Mazos (Decks)</option>
                        <option value="box">Cajas (Boxes)</option>
                    </select>
                </div>

                <div id="containersListWrapper">
                    <p id="loadingMessage" class="muted">Cargando listado de contenedores...</p>
                </div>
            </section>

        </div>
    </main>

    <script src="js/shared/auth.js"></script>
    <script src="js/pages/containers.js"></script>
    <script src="js/shared/footer.js"></script>
</body>
</html>
