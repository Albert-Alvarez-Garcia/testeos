<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro — Gestión de Contenedores</title>
    <link rel="stylesheet" href="portal.css">
    <link rel="stylesheet" href="visor-admin-25d.css">
    <style>
        .management-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 900px) {
            .management-layout { grid-template-columns: 1fr; }
        }
        .container-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color, #333);
            transition: background 0.2s;
        }
        .container-item-row:hover {
            background: rgba(179, 146, 88, 0.1);
        }
        .container-link {
            color: var(--text-main, #fff);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        .container-link:hover {
            color: var(--accent, #b39258);
            text-decoration: underline;
        }
        /* Estilos para campos dinámicos */
        .dynamic-fields {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color, #444);
        }
        .dynamic-fields.active {
            display: block;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .form-group select, .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem;
            border-radius: 6px;
            background: var(--bg-app, #121212);
            color: var(--text-main, #fff);
            border: 1px solid var(--border-color, #333);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html" title="Ir al Inicio" style="display: flex; align-items: center; text-decoration: none;">
                <img src="public/assets/logomagic.png" alt="Logo" style="height: 64px; width: auto;">
            </a>
            <span class="app-subtitle">Binder Pro — Gestión de Contenedores</span>
        </div>
    </header>

    <main>
        <div class="management-layout">
            
            <!-- Panel Izquierdo: Crear Nuevo Contenedor con Subcampos -->
            <section class="create-container-panel fantasy-panel" style="padding: 20px; height: fit-content;">
                <h3 style="color: var(--accent, #b39258); margin-top: 0; margin-bottom: 15px;">Crear Nuevo Contenedor</h3>
                <form id="createContainerForm">
                    <div class="form-group">
                        <label>NOMBRE DEL CONTENEDOR</label>
                        <input type="text" id="containerName" placeholder="Ej. Binder Principal, Mazo Modern" required>
                    </div>

                    <div class="form-group">
                        <label>TIPO DE CONTENEDOR</label>
                        <select id="containerType" required>
                            <option value="">Selecciona un tipo...</option>
                            <option value="binder">Binder / Archivador</option>
                            <option value="deck">Mazo (Deck)</option>
                            <option value="box">Caja (Box)</option>
                        </select>
                    </div>

                    <!-- Subcampos para Binder -->
                    <div id="binderFields" class="dynamic-fields">
                        <div class="form-group">
                            <label>TAMAÑO DEL BINDER</label>
                            <select id="binderSize">
                                <option value="binder_s">Binder Pequeño (2x2 - 4 slots/pág)</option>
                                <option value="binder_m" selected>Binder Mediano (3x3 - 9 slots/pág)</option>
                                <option value="binder_xl">Binder Grande (4x3 - 12 slots/pág)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>NÚMERO DE PÁGINAS</label>
                            <input type="number" id="binderPages" value="40" min="1" max="200">
                        </div>
                    </div>

                    <!-- Subcampos para Deck (Mazo) -->
                    <div id="deckFields" class="dynamic-fields">
                        <div class="form-group">
                            <label>CAPACIDAD MAZO PRINCIPAL</label>
                            <input type="number" id="deckMainCapacity" value="60" min="1" max="250">
                        </div>
                        <div class="form-group">
                            <label>CAPACIDAD RESERVA (SIDEBOARD)</label>
                            <input type="number" id="deckSideboardCapacity" value="15" min="0" max="50">
                        </div>
                    </div>

                    <!-- Subcampos para Box (Caja) -->
                    <div id="boxFields" class="dynamic-fields">
                        <div class="form-group">
                            <label>CAPACIDAD MÁXIMA DE CARTAS</label>
                            <input type="number" id="boxCapacity" value="1000" min="1" max="5000">
                        </div>
                    </div>

                    <button type="submit" class="btn-fantasy" style="width: 100%; padding: 0.75rem; margin-top: 15px;">Guardar Contenedor</button>
                </form>
            </section>

            <!-- Panel Derecho: Listado de Contenedores Existentes -->
            <section class="containers-list-container fantasy-panel" style="padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <h3 style="color: var(--accent, #b39258); margin: 0;">📦 Contenedores Existentes</h3>
                    
                    <select id="filterContainerType" style="padding: 0.5rem; border-radius: 6px; background: var(--bg-app, #121212); color: var(--text-main, #fff); border: 1px solid var(--border-color, #333);">
                        <option value="all">Todos los tipos</option>
                        <option value="binder">Binders</option>
                        <option value="deck">Mazos (Decks)</option>
                        <option value="box">Cajas (Boxes)</option>
                    </select>
                </div>

                <div id="containersListWrapper">
                    <p id="loadingMessage" style="color: var(--text-muted);">Cargando listado de contenedores...</p>
                </div>
            </section>

        </div>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const containerTypeSelect = document.getElementById('containerType');
        const binderFields = document.getElementById('binderFields');
        const deckFields = document.getElementById('deckFields');
        const boxFields = document.getElementById('boxFields');
        const form = document.getElementById('createContainerForm');
        
        const containersListWrapper = document.getElementById('containersListWrapper');
        const filterContainerTypeSelect = document.getElementById('filterContainerType');
        
        let allContainers = [];

        if (window.location.search) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Obtener cabecera de usuario desde localStorage
        function getAuthHeader() {
            const userData = JSON.parse(localStorage.getItem('cardbinder_user'));
            if (!userData || !userData.username) {
                alert('Tu sesión ha expirado o no estás autenticado.');
                window.location.href = 'login.html';
                return {};
            }
            return { 'X-Username': userData.username };
        }

        // Mostrar u ocultar campos dinámicos según el tipo seleccionado
        containerTypeSelect.addEventListener('change', (e) => {
            const type = e.target.value;
            
            binderFields.classList.remove('active');
            deckFields.classList.remove('active');
            boxFields.classList.remove('active');

            if (type === 'binder') {
                binderFields.classList.add('active');
            } else if (type === 'deck') {
                deckFields.classList.add('active');
            } else if (type === 'box') {
                boxFields.classList.add('active');
            }
        });

        async function cargarContenedores() {
            const authHeader = getAuthHeader();
            if (!authHeader['X-Username']) return;

            try {
                const response = await fetch('http://localhost:8000/api/containers/', {
                    headers: {
                        'Content-Type': 'application/json',
                        ...authHeader
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        alert('Tu sesión no es válida.');
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error('Error al listar contenedores');
                }
                const containersRaw = await response.json();

                // Consultar slots para saber los ocupados reales
                allContainers = await Promise.all(containersRaw.map(async c => {
                    try {
                        const slotRes = await fetch(`http://localhost:8000/api/containers/${c.id}/slots`, {
                            headers: { 
                                'Content-Type': 'application/json',
                                ...authHeader 
                            }
                        });
                        if (slotRes.ok) {
                            const slots = await slotRes.json();
                            const filled = slots.filter(s => s.is_occupied).length;
                            const total = slots.length;
                            return { ...c, filled_slots: filled, max_capacity: total };
                        }
                    } catch (e) {
                        console.error(`No se pudieron cargar slots para el contenedor ${c.id}`);
                    }
                    return { ...c, filled_slots: 0, max_capacity: c.max_capacity || 0 };
                }));

                renderizarListadoContenedores();
            } catch (err) {
                console.error("Error al cargar contenedores:", err);
                containersListWrapper.innerHTML = '<p style="color: #ef4444;">Error al cargar el listado de contenedores.</p>';
            }
        }

        function renderizarListadoContenedores() {
            const selectedType = filterContainerTypeSelect ? filterContainerTypeSelect.value : 'all';

            const filtered = allContainers.filter(c => {
                const tipoContenedor = (c.type || c.tipo || '').toLowerCase();
                if (selectedType === 'all') return true;
                return tipoContenedor.includes(selectedType.toLowerCase());
            });

            if (filtered.length === 0) {
                containersListWrapper.innerHTML = '<p style="color: var(--text-muted);">No se encontraron contenedores con este filtro.</p>';
                return;
            }

            containersListWrapper.innerHTML = '';
            
            filtered.forEach(c => {
                const row = document.createElement('div');
                row.className = 'container-item-row';
                
                const nombre = c.name || 'Sin nombre';
                const tipo = (c.type || 'general').toUpperCase();
                
                const slotsLlenos = c.filled_slots ?? c.current_cards ?? c.used ?? 0;
                const capacidadTotal = c.max_capacity || c.capacity || 'N/A';

                row.innerHTML = `
                    <div>
                        <a href="visor-containers.html?container_id=${c.id}" class="container-link">${nombre}</a>
                    </div>
                    <div>
                        <span style="font-size: 0.85rem; color: var(--text-muted);">[${tipo}] - Slots: ${slotsLlenos} / ${capacidadTotal}</span>
                    </div>
                `;

                containersListWrapper.appendChild(row);
            });
        }

        if (filterContainerTypeSelect) {
            filterContainerTypeSelect.addEventListener('change', renderizarListadoContenedores);
        }

        // Envío estructurado de datos con subcampos y autenticación
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('containerName').value.trim();
            const baseType = containerTypeSelect.value;
            const authHeader = getAuthHeader();
            if (!authHeader['X-Username']) return;
            
            let type = baseType;
            let max_capacity = null;
            let slots_per_page = 9; 
            let total_pages = null;   
            let sideboard_capacity = null;

            if (baseType === 'binder') {
                type = document.getElementById('binderSize').value; // 'binder_s', 'binder_m', 'binder_xl'
                total_pages = parseInt(document.getElementById('binderPages').value) || 40;
                
                if (type === 'binder_s') {
                    slots_per_page = 4;
                } else if (type === 'binder_xl') {
                    slots_per_page = 12;
                } else {
                    slots_per_page = 9; 
                }

                max_capacity = total_pages * slots_per_page;
            } else if (baseType === 'deck') {
                max_capacity = parseInt(document.getElementById('deckMainCapacity').value) || 60;
                sideboard_capacity = parseInt(document.getElementById('deckSideboardCapacity').value) || 15;
            } else if (baseType === 'box') {
                max_capacity = parseInt(document.getElementById('boxCapacity').value) || 1000;
            }

            try {
                const response = await fetch('http://localhost:8000/api/containers/', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        ...authHeader
                    },
                    body: JSON.stringify({ 
                        name, 
                        type, 
                        max_capacity, 
                        slots_per_page,   
                        total_pages,      
                        sideboard_capacity 
                    })
                });

                if (!response.ok) {
                    throw new Error('Error al registrar el contenedor');
                }

                const result = await response.json();
                alert(`¡Contenedor "${result.name}" creado con éxito!`);
                form.reset();
                binderFields.classList.remove('active');
                deckFields.classList.remove('active');
                boxFields.classList.remove('active');
                
                await cargarContenedores();

            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un error al crear el contenedor en el servidor.");
            }
        });

        cargarContenedores();
      });

      window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('preferred-mana-theme') || 'default';
        document.documentElement.setAttribute('data-theme', savedTheme);
      });
    </script>
</body>
</html>
