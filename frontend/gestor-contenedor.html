<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro — Gestión Carta</title>
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="visor-containers.css">
</head>
<body>

    <header>
        <div class="logo-container">
          <img src="Magicthegathering-logo(1).svg" alt="Magic: The Gathering Logo">
          <span class="app-subtitle">Gestión Carta</span>
        </div>
  
        <div class="header-controls" style="display: flex; gap: 10px; align-items: center;">
          <!-- Únicamente el selector de contenedor necesario -->
          <select id="containerSelector" style="padding: 0.65rem; border-radius: 8px; background: var(--bg-app); color: var(--text-main); border: 1px solid var(--border-color);">
              <option value="">Selecciona un contenedor para gestionar...</option>
          </select>
        </div>
    </header>

    <main>
        <div class="workspace-grid">
            
            <!-- Columna Izquierda: Visor 2.5D + Datos integrados + Zona en blanco para acciones -->
            <div class="visor-column">
                <button id="toggleMagnifierBtn" class="visor-mode-btn">
                    🔍 Modo Lupa: <span id="modeStatus">DESACTIVADO</span>
                </button>

                <div class="card-perspective-container" id="cardContainer">
                    <div class="interactive-card" id="interactiveCard">
                        <img id="dynamicCardImg" src="public/assets/capicarta.png" alt="Vista previa de la carta">
                    </div>
                    <div class="card-magnifier" id="cardMagnifier"></div>
                </div>

                <!-- Datos básicos integrados -->
                <div class="visor-card-details" id="visorCardDetails" style="margin-top: 1rem; padding: 0.85rem 1rem; background: var(--bg-card, #1e1e1e); border-radius: 8px; border: 1px solid var(--border-color); color: var(--text-main);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
                        <span id="visorCardName" style="font-weight: 600; font-size: 1rem;">Selecciona una carta</span>
                        <span id="visorCardMana" style="font-family: monospace; font-size: 0.9rem; color: var(--primary-color);"></span>
                    </div>
                    <div id="visorCardType" style="font-size: 0.8rem; color: var(--text-muted);">—</div>
                </div>

                <!-- Zona en blanco inferior para futuras acciones e información -->
                <div id="cardActionZone" style="margin-top: 1rem; padding: 1rem; background: var(--bg-card, #1e1e1e); border-radius: 8px; border: 1px solid var(--border-color); min-height: 100px;">
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0; text-align: center;">Acciones e información de la carta...</p>
                </div>
            </div>

            <!-- Columna Derecha: Contenedor y su estructura -->
            <div class="details-column" style="display: flex; flex-direction: column; gap: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 id="containerTitle" style="margin: 0; font-size: 1.2rem;">Selecciona un contenedor</h2>
                    <div id="containerStats" style="color: var(--text-muted); font-size: 0.85rem;">—</div>
                </div>

                <div class="visual-workspace" id="visualWorkspace" style="background: var(--bg-card, #1e1e1e); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; min-height: 500px; max-height: 70vh; overflow-y: auto;">
                    <div class="placeholder-msg" style="text-align: center; margin-top: 15vh;">
                        <p style="color: var(--text-muted); font-size: 0.95rem;">Elige un contenedor arriba para desplegar sus huecos...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('preferred-mana-theme') || 'default';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // ============================================================
        // VISOR DE CARTA
        // La pantalla recibe la carta desde visor-containers mediante:
        // ?card_id=...&printing_id=...&img=...&name=...&type=...&mana=...
        // Para esta pantalla NO se comprueba titularidad.
        // ============================================================

        const params = new URLSearchParams(window.location.search);

        const cardId = params.get('card_id');
        const printingId = params.get('printing_id');
        const imageUrl = params.get('img');
        const cardName = params.get('name');
        const cardType = params.get('type');
        const cardMana = params.get('mana');

        const card = document.getElementById('interactiveCard');
        const cardContainer = document.getElementById('cardContainer');
        const cardImage = document.getElementById('dynamicCardImg');
        const magnifier = document.getElementById('cardMagnifier');
        const toggleBtn = document.getElementById('toggleMagnifierBtn');
        const modeStatus = document.getElementById('modeStatus');

        const visorName = document.getElementById('visorCardName');
        const visorMana = document.getElementById('visorCardMana');
        const visorType = document.getElementById('visorCardType');

        let magnifierEnabled = false;

        const ZOOM_SCALE = 2;
        const MAGNIFIER_SIZE = 160;

        // Mostrar los datos que ya nos entrega visor-containers.
        if (cardName && visorName) {
          visorName.textContent = cardName;
        }

        if (cardMana && visorMana) {
          visorMana.textContent = cardMana;
        }

        if (cardType && visorType) {
          visorType.textContent = cardType;
        }

        // El dato fundamental: mostrar la imagen de la carta.
        if (imageUrl && cardImage) {
          cardImage.src = imageUrl;
          cardImage.alt = cardName || 'Carta';
        } else if (cardImage) {
          cardImage.src = 'public/assets/nocapi.png';
        }

        // Guardamos los IDs por si más adelante queremos añadir acciones.
        cardImage.dataset.cardId = cardId || '';
        cardImage.dataset.printingId = printingId || '';

        // ------------------------------------------------------------
        // LUPA
        // ------------------------------------------------------------

        function actualizarLupa() {
          if (!cardImage || !card || !magnifier) return;

          const width = card.offsetWidth;
          const height = card.offsetHeight;

          if (width <= 0 || height <= 0) return;

          magnifier.style.width = MAGNIFIER_SIZE + 'px';
          magnifier.style.height = MAGNIFIER_SIZE + 'px';
          magnifier.style.backgroundSize =
            `${width * ZOOM_SCALE}px ${height * ZOOM_SCALE}px`;

          magnifier.style.backgroundImage = `url("${cardImage.src}")`;
          magnifier.style.backgroundRepeat = 'no-repeat';
        }

        if (cardImage) {
          cardImage.addEventListener('load', () => {
            actualizarLupa();
          });
        }

        if (toggleBtn) {
          toggleBtn.addEventListener('click', () => {
            magnifierEnabled = !magnifierEnabled;

            toggleBtn.classList.toggle('active', magnifierEnabled);

            if (modeStatus) {
              modeStatus.textContent =
                magnifierEnabled ? 'ACTIVADO' : 'DESACTIVADO';
            }

            if (!magnifierEnabled && magnifier) {
              magnifier.classList.remove('is-visible');
            }

            actualizarLupa();
          });
        }

        if (cardContainer && card && magnifier && cardImage) {

          cardContainer.addEventListener('mousemove', (event) => {

            const rect = cardContainer.getBoundingClientRect();

            if (rect.width <= 0 || rect.height <= 0) return;

            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            // Efecto 2.5D de la carta.
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX =
              -((mouseY - centerY) / centerY) * 15;

            const rotateY =
              ((mouseX - centerX) / centerX) * 15;

            card.style.transform =
              `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05,1.05,1.05)`;

            if (!magnifierEnabled) {
              magnifier.classList.remove('is-visible');
              return;
            }

            actualizarLupa();

            const magX = mouseX - MAGNIFIER_SIZE / 2;
            const magY = mouseY - MAGNIFIER_SIZE / 2;

            magnifier.style.left = `${magX}px`;
            magnifier.style.top = `${magY}px`;

            const backgroundWidth = card.offsetWidth * ZOOM_SCALE;
            const backgroundHeight = card.offsetHeight * ZOOM_SCALE;

            const percentX = mouseX / rect.width;
            const percentY = mouseY / rect.height;

            const bgPosX =
              -(percentX * backgroundWidth) + MAGNIFIER_SIZE / 2;

            const bgPosY =
              -(percentY * backgroundHeight) + MAGNIFIER_SIZE / 2;

            magnifier.style.backgroundPosition =
              `${bgPosX}px ${bgPosY}px`;

            magnifier.style.backgroundImage =
              `url("${cardImage.src}")`;

            magnifier.classList.add('is-visible');
          });

          cardContainer.addEventListener('mouseleave', () => {
            magnifier.classList.remove('is-visible');

            card.style.transform =
              'rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
          });
        }

        // Recalcular al terminar de cargar la página por si la imagen
        // estaba cacheada y el evento load ya había ocurrido.
        requestAnimationFrame(() => {
          actualizarLupa();
        });
      });
    </script>
</body>
</html>
