<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro — Gestión Carta</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portal.css">
    <link rel="stylesheet" href="visor-containers.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0705;
            color: #fef3c7;
        }
        .magic-title {
            font-family: 'Cinzel', serif;
        }
        .visor-mode-btn {
            background: linear-gradient(135deg, #1e140d 0%, #2a1d13 100%);
            border: 1px solid #8c6d36;
            color: #fef3c7;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .visor-mode-btn:hover, .visor-mode-btn.active {
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Cabecera simplificada -->
    <header class="w-full max-w-xl flex justify-between items-center mb-6 bg-[#140e09] border border-[#b39258]/30 p-4 rounded-xl shadow-lg">
        <div class="flex items-center gap-4">
            <a href="index.html" title="Volver al inicio">
                <img src="public/assets/logomagic.png" alt="Magic Logo" class="h-10 hover:scale-105 transition-transform">
            </a>
            <span class="magic-title text-xl text-amber-400 font-bold border-l border-[#b39258]/30 pl-4">
                Gestión Carta
            </span>
        </div>
  
        <div>
            <button onclick="window.history.back()" class="bg-[#1e140d] hover:bg-[#2a1d13] text-amber-200 font-semibold px-4 py-2 rounded-xl text-xs transition-all border border-[#b39258]/40 cursor-pointer">
                ⬅ Volver al Visor
            </button>
        </div>
    </header>

    <!-- Contenido Principal Centrado -->
    <main class="w-full max-w-xl flex flex-col items-center gap-4">
        <button id="toggleMagnifierBtn" class="visor-mode-btn">
            🔍 Modo Lupa: <span id="modeStatus">DESACTIVADO</span>
        </button>

        <div class="card-perspective-container w-full flex justify-center py-2" id="cardContainer">
            <div class="interactive-card" id="interactiveCard">
                <img id="dynamicCardImg" src="public/assets/capicarta.png" alt="Vista previa de la carta" class="rounded-xl shadow-2xl max-h-[520px] object-contain">
            </div>
            <div class="card-magnifier" id="cardMagnifier"></div>
        </div>
    </main>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('preferred-mana-theme') || 'default';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const params = new URLSearchParams(window.location.search);

        const cardId = params.get('card_id');
        const printingId = params.get('printing_id');
        const imageUrl = params.get('img');
        const cardName = params.get('name');

        const card = document.getElementById('interactiveCard');
        const cardContainer = document.getElementById('cardContainer');
        const cardImage = document.getElementById('dynamicCardImg');
        const magnifier = document.getElementById('cardMagnifier');
        const toggleBtn = document.getElementById('toggleMagnifierBtn');
        const modeStatus = document.getElementById('modeStatus');

        let magnifierEnabled = false;

        const ZOOM_SCALE = 2;
        const MAGNIFIER_SIZE = 160;

        if (imageUrl && cardImage) {
          cardImage.src = decodeURIComponent(imageUrl);
          cardImage.alt = cardName ? decodeURIComponent(cardName) : 'Carta';
        } else if (cardImage) {
          cardImage.src = 'public/assets/nocapi.png';
        }

        if (cardImage) {
            cardImage.dataset.cardId = cardId || '';
            cardImage.dataset.printingId = printingId || '';
        }

        function actualizarLupa() {
          if (!cardImage || !card || !magnifier) return;

          const width = card.offsetWidth;
          const height = card.offsetHeight;

          if (width <= 0 || height <= 0) return;

          magnifier.style.width = MAGNIFIER_SIZE + 'px';
          magnifier.style.height = MAGNIFIER_SIZE + 'px';
          magnifier.style.backgroundSize = `${width * ZOOM_SCALE}px ${height * ZOOM_SCALE}px`;

          magnifier.style.backgroundImage = `url("${cardImage.src}")`;
          magnifier.style.backgroundRepeat = 'no-repeat';
        }

        if (cardImage) {
          cardImage.addEventListener('load', () => {
            actualizarLupa();
          });
        }

        if (toggleBtn) {
          toggleBtn.addEventListener('click', () => {
            magnifierEnabled = !magnifierEnabled;

            toggleBtn.classList.toggle('active', magnifierEnabled);

            if (modeStatus) {
              modeStatus.textContent = magnifierEnabled ? 'ACTIVADO' : 'DESACTIVADO';
            }

            if (!magnifierEnabled && magnifier) {
              magnifier.classList.remove('is-visible');
            }

            actualizarLupa();
          });
        }

        if (cardContainer && card && magnifier && cardImage) {
          cardContainer.addEventListener('mousemove', (event) => {
            const rect = cardContainer.getBoundingClientRect();

            if (rect.width <= 0 || rect.height <= 0) return;

            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = -((mouseY - centerY) / centerY) * 15;
            const rotateY = ((mouseX - centerX) / centerX) * 15;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05,1.05,1.05)`;

            if (!magnifierEnabled) {
              magnifier.classList.remove('is-visible');
              return;
            }

            actualizarLupa();

            const magX = mouseX - MAGNIFIER_SIZE / 2;
            const magY = mouseY - MAGNIFIER_SIZE / 2;

            magnifier.style.left = `${magX}px`;
            magnifier.style.top = `${magY}px`;

            const backgroundWidth = card.offsetWidth * ZOOM_SCALE;
            const backgroundHeight = card.offsetHeight * ZOOM_SCALE;

            const percentX = mouseX / rect.width;
            const percentY = mouseY / rect.height;

            const bgPosX = -(percentX * backgroundWidth) + MAGNIFIER_SIZE / 2;
            const bgPosY = -(percentY * backgroundHeight) + MAGNIFIER_SIZE / 2;

            magnifier.style.backgroundPosition = `${bgPosX}px ${bgPosY}px`;
            magnifier.style.backgroundImage = `url("${cardImage.src}")`;

            magnifier.classList.add('is-visible');
          });

          cardContainer.addEventListener('mouseleave', () => {
            magnifier.classList.remove('is-visible');
            card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
          });
        }

        requestAnimationFrame(() => {
          actualizarLupa();
        });
      });
    </script>
</body>
</html>
