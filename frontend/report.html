<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder - Informe de Colección</title>

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Estilos Unificados -->
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="css/report.css">

    <!-- Fuentes opcionales para la tipografía de títulos e interfaz -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="js/shared/theme.js"></script>
</head>
<body class="min-h-screen w-full flex flex-col justify-between py-6 px-6 font-sans select-none">

    <!-- 🔙 BOTÓN DE RETORNO AL PORTAL Y CHIP DE USUARIO -->
    <header class="w-full max-w-7xl mx-auto flex items-center justify-between gap-4 mb-6 z-40">
        <a href="index.html" class="bg-[rgb(var(--c-panel)/0.9)] border border-[rgb(var(--c-gold)/0.6)] px-4 py-2 rounded-xl text-[rgb(var(--c-amber-200))] text-xs font-semibold hover:bg-[rgb(var(--c-gold)/0.3)] transition-colors shadow-2xl backdrop-blur-md flex items-center space-x-2">
            <span>← Volver al Portal</span>
        </a>
        <h1 class="font-magic text-2xl md:text-3xl font-bold text-[rgb(var(--c-amber-300))] tracking-wider drop-shadow-md text-center flex-1">
            Informe de Colección
        </h1>
        <div id="user-chip" class="fantasy-panel px-3 py-1.5 flex items-center gap-2 text-xs text-[rgb(var(--c-amber-200))] border border-[rgb(var(--c-gold)/0.4)]"></div>
    </header>

    <!-- 🎬 CONTENEDOR PRINCIPAL -->
    <main class="w-full max-w-7xl mx-auto flex-1 flex flex-col gap-6 relative z-20">

        <!-- RESUMEN DE LA COLECCIÓN -->
        <p id="summary" class="text-sm text-[rgb(var(--c-amber-200)/0.7)]" role="status" aria-live="polite"></p>

        <!-- BARRA DE HERRAMIENTAS (Buscador + Orden + Paginación) -->
        <section class="fantasy-panel p-4 flex flex-wrap items-end gap-4 border border-[rgb(var(--c-gold)/0.3)]" aria-label="Búsqueda y orden">
            <div class="flex-1 min-w-[260px] flex flex-col gap-1">
                <label for="q" class="text-xs text-[rgb(var(--c-amber-200)/0.6)] font-semibold">Buscar por nombre, set o tipo</label>
                <input id="q" type="search" autocomplete="off" placeholder="Por ejemplo: bolt, alpha o legendary" class="w-full">
            </div>

            <div class="flex flex-col gap-1 min-w-[160px]">
                <label for="sort" class="text-xs text-[rgb(var(--c-amber-200)/0.6)] font-semibold">Ordenar por</label>
                <select id="sort" class="w-full">
                    <option value="name">Nombre</option>
                    <option value="type">Tipo</option>
                    <option value="copies">Número de copias</option>
                    <option value="printings">Número de artes</option>
                    <option value="containers">Número de contenedores</option>
                    <option value="added">Fecha de alta</option>
                </select>
            </div>

            <button id="dir" class="btn-fantasy py-2.5 text-xs h-[42px]" type="button">Ascendente</button>

            <div class="flex flex-col gap-1 min-w-[160px]">
                <label for="type" class="text-xs text-[rgb(var(--c-amber-200)/0.6)] font-semibold">Tipo de carta</label>
                <select id="type" class="w-full"><option value="">Cualquier tipo...</option></select>
            </div>

            <div class="flex flex-col gap-1 min-w-[160px]">
                <label for="subtype" class="text-xs text-[rgb(var(--c-amber-200)/0.6)] font-semibold">Subtipo</label>
                <select id="subtype" class="w-full" disabled><option value="">Cualquier subtipo...</option></select>
            </div>

            <div class="flex flex-col gap-1 min-w-[200px]">
                <label for="container" class="text-xs text-[rgb(var(--c-amber-200)/0.6)] font-semibold">Contenedor</label>
                <select id="container" class="w-full"><option value="">Todos los contenedores</option></select>
            </div>

            <div class="flex flex-col gap-1 min-w-[120px]">
                <label for="size" class="text-xs text-[rgb(var(--c-amber-200)/0.6)] font-semibold">Cartas por página</label>
                <select id="size" class="w-full">
                    <option value="12">12</option>
                    <option value="24">24</option>
                    <option value="48">48</option>
                    <option value="96">96</option>
                </select>
            </div>
        </section>

        <!-- CHIPS DE FILTRO ACTIVO -->
        <div id="chips" class="flex flex-wrap items-center gap-2"></div>

        <!-- LISTADO DE RESULTADOS DE CARTAS -->
        <section id="results" class="flex-1 flex flex-col gap-6" tabindex="-1" aria-label="Resultados" aria-busy="true">
            <div id="entries" class="flex flex-col gap-6"></div>
            <nav id="pager" class="fantasy-panel p-4 flex flex-wrap items-center justify-between gap-4 border border-[rgb(var(--c-gold)/0.3)]"></nav>
        </section>

    </main>

    <!-- VISOR AMPLIADO (LIGHTBOX) -->
    <dialog id="lightbox" class="fantasy-panel p-0 max-w-md w-full border-2 border-[rgb(var(--c-gold))] rounded-2xl overflow-hidden backdrop:bg-black/80">
        <img id="lightbox-img" class="w-full h-auto block" alt="">
        <div class="p-4 flex items-center justify-between gap-4 bg-[rgb(var(--c-panel))]">
            <p id="lightbox-caption" class="text-xs text-[rgb(var(--c-amber-200)/0.8)] font-semibold"></p>
            <button id="lightbox-close" class="btn-fantasy text-xs py-1.5 px-3" type="button">Cerrar</button>
        </div>
    </dialog>

    <script src="js/shared/section-nav.js" data-section="coleccion"></script>
    <noscript><p class="p-6 text-center text-[rgb(var(--c-amber-200))]">Este informe necesita JavaScript para funcionar.</p></noscript>

    <script src="js/pages/report.js"></script>
    <script src="js/pages/dataio.js"></script>
    <script src="js/shared/footer.js"></script>
</body>
</html>
