<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🃏%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 2.5D con Lupa Conmutable - Card Binder</title>
    <link rel="stylesheet" href="css/visor.css">
</head>
<body>

    <div class="visor-wrapper" style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem; padding-top: 2rem;">
        
        <!-- Botón de control de la lupa -->
        <button id="toggleMagnifierBtn" class="visor-mode-btn">
            🔍 Modo Lupa: <span id="modeStatus">DESACTIVADO</span>
        </button>

        <div class="card-perspective-container" id="cardContainer">
            <div class="interactive-card" id="interactiveCard">
                <!-- Usamos un ID para que la API inyecte la carta aleatoria aquí -->
                <img id="dynamicCardImg" src="" alt="Carta desde Scryfall">
            </div>
            <div class="card-magnifier" id="cardMagnifier"></div>
        </div>

    </div>

    <script src="js/pages/visor.js"></script>
    <script src="js/shared/footer.js"></script>
</body>
</html>
