<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro — Visor de Contenedores</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portal.css">
    <link rel="stylesheet" href="visor-containers.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0705;
            color: #fef3c7;
        }
        .magic-title {
            font-family: 'Cinzel', serif;
        }
        .container-card {
            background: rgba(20, 14, 9, 0.92);
            border: 1px solid #8c6d36;
            transition: all 0.2s ease-in-out;
        }
        .container-card:hover {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Cabecera estilo Magic / Portal -->
    <header class="w-full max-w-6xl flex flex-wrap gap-4 justify-between items-center mb-6 bg-[#140e09] border border-[#b39258]/30 p-4 rounded-xl shadow-lg">
        <div class="flex items-center gap-4">
            <a href="index.html" title="Volver al inicio">
                <img src="public/assets/logomagic.png" alt="Logo Magic" class="h-10 hover:scale-105 transition-transform">
            </a>
            <h1 class="magic-title text-xl text-amber-400 font-bold border-l border-[#b39258]/30 pl-4">
                📜 Visor de Contenedores
            </h1>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <!-- Filtro por tipo -->
            <select id="filterContainerType" class="bg-[#0b0705] border border-[#b39258]/30 text-amber-100 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-amber-400">
                <option value="all">Todos los tipos</option>
                <option value="binder_s">Binder Pequeño (2x2)</option>
                <option value="binder_m">Binder Mediano (3x3)</option>
                <option value="binder_xl">Binder Grande (4x3)</option>
                <option value="deck">Mazo (Deck)</option>
                <option value="box">Caja (Box)</option>
            </select>

            <!-- Desplegable directo -->
            <select id="containerSelector" class="bg-[#0b0705] border border-[#b39258]/30 text-amber-100 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-amber-400 max-w-[250px]">
                <option value="">Cargando contenedores...</option>
            </select>

            <button id="showAllContainersBtn" class="bg-[#1e140d] hover:bg-[#2a1d13] text-amber-200 font-semibold px-3 py-2 rounded-xl text-xs transition-all border border-[#b39258]/40 cursor-pointer hidden">
                🏛️ Ver Todos
            </button>
        </div>
    </header>

    <!-- Panel de información del contenedor seleccionado -->
    <main class="w-full max-w-6xl flex flex-col gap-6">
        <section id="containerInfoBar" class="hidden bg-[#140e09] border border-[#b39258]/30 p-4 rounded-xl shadow-lg flex justify-between items-center">
            <div>
                <h2 id="containerTitle" class="magic-title text-lg text-amber-400 font-bold">Selecciona un contenedor</h2>
                <div id="containerStats" class="text-xs text-amber-200/60">—</div>
            </div>
            <button id="backToGridBtn" class="bg-[#1e140d] hover:bg-[#2a1d13] text-amber-200 px-3 py-1.5 rounded-lg text-xs border border-[#b39258]/40 cursor-pointer">
                ⬅ Volver al listado
            </button>
        </section>

        <!-- Espacio de Trabajo Principal (Rejilla de Contenedores / Visor de Slots) -->
        <section id="visualWorkspace" class="w-full min-h-[400px]">
            <div class="text-center text-amber-200/50 py-12 italic">Cargando la bóveda de contenedores...</div>
        </section>
    </main>

    <!-- Modal de Confirmación de Borrado -->
    <div id="deleteConfirmModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[2000] p-4">
        <div class="bg-[#140e09] border border-red-600/50 rounded-2xl p-6 max-w-md w-full shadow-2xl text-center">
            <h3 class="magic-title text-xl text-red-500 mb-2 font-bold">⚠️ Confirmar Borrado</h3>
            <p id="deleteModalText" class="text-amber-100/80 text-xs mb-6">¿Deseas retirar esta carta del contenedor?</p>
            
            <div class="flex justify-end gap-3">
                <button id="cancelDeleteBtn" class="bg-[#1e140d] hover:bg-[#2a1d13] text-amber-200 px-4 py-2 rounded-xl text-xs border border-[#b39258]/40 cursor-pointer">
                    Cancelar
                </button>
                <button id="confirmDeleteBtn" class="bg-red-900/80 hover:bg-red-800 text-white font-bold px-4 py-2 rounded-xl text-xs transition-all border border-red-700/50 cursor-pointer">
                    Eliminar
                </button>
            </div>
        </div>
    </div>

    <script src="visor-containers.js"></script>
</body>
</html>
