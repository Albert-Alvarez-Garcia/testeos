<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro — Visor de Contenedores</title>
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes globales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Estilos unificados -->
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="css/visor-containers.css">
    <script src="js/shared/theme.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center p-4 select-none">

    <!-- Cabecera estilo Magic / Portal -->
    <header class="w-full max-w-6xl flex flex-wrap gap-4 justify-between items-center mb-6 fantasy-panel p-4">
        <div class="flex items-center gap-4">
            <a href="index.html" title="Volver al inicio">
                <img src="public/assets/logomagic.png" alt="Logo Magic" class="h-10 hover:scale-105 transition-transform">
            </a>
            <h1 class="font-magic text-xl text-[rgb(var(--c-amber-400))] font-bold border-l border-[rgb(var(--c-gold)/0.3)] pl-4">
                📜 Visor de Contenedores
            </h1>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <!-- Filtro por tipo -->
            <select id="filterContainerType" class="text-xs max-w-[180px]">
                <option value="all">Todos los tipos</option>
                <option value="binder_s">Binder Pequeño (2x2)</option>
                <option value="binder_m">Binder Mediano (3x3)</option>
                <option value="binder_xl">Binder Grande (4x3)</option>
                <option value="deck">Mazo (Deck)</option>
                <option value="box">Caja (Box)</option>
            </select>

            <!-- Desplegable directo -->
            <select id="containerSelector" class="text-xs max-w-[250px]">
                <option value="">Cargando contenedores...</option>
            </select>

            <button id="showAllContainersBtn" class="btn-fantasy text-xs py-2 px-3 hidden" type="button">
                🏛️ Ver Todos
            </button>
        </div>
    </header>

    <!-- Panel de información del contenedor seleccionado -->
    <main class="w-full max-w-6xl flex flex-col gap-6">
        <section id="containerInfoBar" class="hidden fantasy-panel p-4 flex justify-between items-center">
            <div>
                <h2 id="containerTitle" class="font-magic text-lg text-[rgb(var(--c-amber-400))] font-bold">Selecciona un contenedor</h2>
                <div id="containerStats" class="text-xs text-[rgb(var(--c-amber-200)/0.6)]">—</div>
            </div>
            <button id="backToGridBtn" class="btn-fantasy text-xs py-1.5 px-3" type="button">
                ⬅ Volver al listado
            </button>
        </section>

        <!-- Espacio de Trabajo Principal (Rejilla de Contenedores / Visor de Slots) -->
        <section id="visualWorkspace" class="w-full min-h-[400px]">
            <div class="text-center text-[rgb(var(--c-amber-200)/0.5)] py-12 italic">Cargando la bóveda de contenedores...</div>
        </section>
    </main>

    <!-- Modal de Confirmación de Borrado -->
    <div id="deleteConfirmModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[2000] p-4 backdrop-blur-sm">
        <div class="fantasy-panel border-red-600/50 p-6 max-w-md w-full text-center">
            <h3 class="font-magic text-xl text-red-500 mb-2 font-bold">⚠️ Confirmar Borrado</h3>
            <p id="deleteModalText" class="text-[rgb(var(--c-amber-100)/0.8)] text-xs mb-6">¿Deseas retirar esta carta del contenedor?</p>
            
            <div class="flex justify-end gap-3">
                <button id="cancelDeleteBtn" class="btn-fantasy text-xs py-2 px-4" type="button">
                    Cancelar
                </button>
                <button id="confirmDeleteBtn" class="bg-red-900/80 hover:bg-red-800 text-white font-bold px-4 py-2 rounded-lg text-xs transition-all border border-red-700/50 cursor-pointer" type="button">
                    Eliminar
                </button>
            </div>
        </div>
    </div>

    <!-- Visor Ampliado (Lightbox idéntico al del informe de colección) -->
    <dialog id="lightbox" class="fantasy-panel p-0 max-w-md w-full border-2 border-[rgb(var(--c-gold))] rounded-2xl overflow-hidden backdrop:bg-black/80">
        <img id="lightbox-img" class="w-full h-auto block" alt="">
        <div class="p-4 flex items-center justify-between gap-4 bg-[rgb(var(--c-panel))]">
            <p id="lightbox-caption" class="text-xs text-[rgb(var(--c-amber-200)/0.8)] font-semibold"></p>
            <button id="lightbox-close" class="btn-fantasy text-xs py-1.5 px-3" type="button">Cerrar</button>
        </div>
    </dialog>

    <script src="js/pages/visor-containers.js"></script>
</body>
</html>
