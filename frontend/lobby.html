<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🃏%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro - Sala de Espera (Lobby)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/portal.css">
    <script src="js/shared/theme.js"></script>
</head>
<body class="font-ui min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Cabecera del Lobby -->
    <div class="w-full max-w-4xl flex flex-wrap gap-3 justify-between items-center mb-6 bg-[rgb(var(--c-panel))] border border-[rgb(var(--c-gold)/0.3)] p-4 rounded-xl shadow-lg">
        <div>
            <h1 class="magic-title text-xl text-[rgb(var(--c-amber-400))] font-bold">🏛️ Sala de Duelo: <span id="room-name-display">sala-1</span></h1>
            <p id="room-status" class="text-xs text-[rgb(var(--c-amber-200)/0.6)]">Conectando al vestíbulo...</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-right">
                <span class="text-xs text-[rgb(var(--c-amber-200)/0.7)]">Jugadores en sala:</span>
                <span id="player-count" class="text-xl font-bold text-emerald-400 ml-2">0/4</span>
            </div>
            <button id="invite-btn" type="button" class="bg-[rgb(var(--c-raised-2))] hover:bg-[rgb(var(--c-raised-3))] text-[rgb(var(--c-amber-200))] font-semibold px-3 py-2 rounded-xl text-xs transition-all border border-[rgb(var(--c-gold)/0.4)] cursor-pointer">
                🔗 Invitar
            </button>
            <button id="leave-room-btn" type="button" class="bg-red-900/80 hover:bg-red-800 text-white font-bold px-3 py-2 rounded-xl text-xs transition-all shadow cursor-pointer border border-red-700/50">
                🚪 Salir
            </button>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Jugadores y controles del Host -->
        <div class="bg-[rgb(var(--c-panel))] border border-[rgb(var(--c-gold)/0.4)] rounded-2xl p-6 shadow-2xl flex flex-col justify-between">
            <div>
                <h2 class="magic-title text-sm font-bold text-[rgb(var(--c-amber-400))] mb-4 uppercase tracking-wider">👥 Combatientes</h2>
                <ul id="players-list" class="space-y-2 mb-6">
                    <li class="text-xs text-[rgb(var(--c-amber-200)/0.5)] italic">Esperando jugadores...</li>
                </ul>
            </div>

            <div id="host-controls" class="hidden border-t border-[rgb(var(--c-gold)/0.2)] pt-4 mt-4">
                <h3 class="text-xs font-semibold text-[rgb(var(--c-amber-300))] mb-2">⚙️ Configuración de Sala</h3>
                <label for="max-players-select" class="block text-[11px] text-[rgb(var(--c-amber-200)/0.7)] mb-1">Máximo de jugadores:</label>
                <select id="max-players-select" class="w-full bg-[rgb(var(--c-ink))] border border-[rgb(var(--c-gold)/0.3)] text-[rgb(var(--c-amber-100))] text-xs rounded-lg p-2 mb-4 focus:outline-none focus:border-[rgb(var(--c-amber-400))]">
                    <option value="1">1 Jugador (Práctica)</option>
                    <option value="2">2 Jugadores (Duelo)</option>
                    <option value="3">3 Jugadores</option>
                    <option value="4" selected>4 Jugadores</option>
                </select>

                <button id="start-game-btn" type="button" class="w-full bg-emerald-700 hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-lg cursor-pointer">
                    🚀 Comenzar Partida
                </button>
            </div>
            <div id="waiting-host-msg" class="text-center text-xs text-[rgb(var(--c-amber-200)/0.6)] italic border-t border-[rgb(var(--c-gold)/0.2)] pt-4 mt-4">
                Esperando a que el Host inicie la partida...
            </div>
        </div>

        <!-- Chat -->
        <div class="md:col-span-2 bg-[rgb(var(--c-panel))] border border-[rgb(var(--c-gold)/0.4)] rounded-2xl p-6 shadow-2xl flex flex-col justify-between h-[420px] md:h-[500px]">
            <h2 class="magic-title text-sm font-bold text-[rgb(var(--c-amber-400))] mb-4 uppercase tracking-wider">💬 Conversación en el Vestíbulo</h2>

            <div id="chat-messages" aria-live="polite" class="flex-1 min-h-0 bg-[rgb(var(--c-ink))] border border-[rgb(var(--c-gold)/0.2)] rounded-xl p-4 overflow-y-auto space-y-2 mb-4 text-xs">
                <div class="text-[rgb(var(--c-amber-200)/0.4)] italic">Bienvenido al vestíbulo. ¡Prepara tus tácticas!</div>
            </div>

            <form id="chat-form" class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Escribe un mensaje..." autocomplete="off" maxlength="200"
                    class="flex-1 bg-[rgb(var(--c-ink))] border border-[rgb(var(--c-gold)/0.3)] text-[rgb(var(--c-amber-100))] text-xs rounded-xl px-4 py-3 focus:outline-none focus:border-[rgb(var(--c-amber-400))]">
                <button type="submit" class="bg-[rgb(var(--c-amber-600))] hover:bg-[rgb(var(--c-amber-500))] text-black font-bold px-5 py-3 rounded-xl text-xs transition-all cursor-pointer">
                    Enviar
                </button>
            </form>
        </div>

    </div>

    <script src="js/pages/lobby.js"></script>
    <script src="js/shared/footer.js"></script>
</body>
</html>
