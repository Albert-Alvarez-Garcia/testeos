<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro — Mi Colección</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="css/coleccion.css">
    <script src="js/shared/theme.js"></script>
</head>
<body>

    <a class="skip-link" href="#cardGrid">Saltar a las cartas</a>

    <header class="col-header">
        <div class="col-header-title">
            <a href="index.html" title="Volver al inicio">
                <img src="public/assets/logomagic.png" alt="Card Binder Pro" class="col-logo">
            </a>
            <h1>📚 Mi Colección</h1>
        </div>


        <div class="col-header-actions">
            <button type="button" id="exportBtn" class="col-btn">Exportar JSON</button>
            <button type="button" id="importBtn" class="col-btn">Importar JSON</button>
            <button type="button" id="printBtn" class="col-btn">Imprimir informe</button>
        </div>
    </header>

    <main class="col-main">

        <!-- Totales -->
        <section class="col-panel summary" aria-labelledby="summaryTitle">
            <h2 id="summaryTitle" class="sr-only">Resumen de la colección</h2>
            <dl class="stat-row" id="statRow">
                <div class="stat"><dt>Copias</dt><dd id="statCopies">—</dd></div>
                <div class="stat"><dt>Cartas distintas</dt><dd id="statCards">—</dd></div>
                <div class="stat"><dt>Artes distintos</dt><dd id="statPrintings">—</dd></div>
                <div class="stat"><dt>Copias foil</dt><dd id="statFoil">—</dd></div>
                <div class="stat"><dt>Contenedores</dt><dd id="statContainers">—</dd></div>
            </dl>

            <details class="report" id="reportDetails">
                <summary>Informe de la colección</summary>
                <div class="report-grid" id="reportBody">
                    <p class="muted">Cargando informe…</p>
                </div>
            </details>
        </section>

        <!-- Filtros -->
        <form class="col-panel filters" id="filtersForm" role="search" aria-label="Filtros de la colección" autocomplete="off">
            <div class="field grow">
                <label for="fName">Nombre</label>
                <input type="search" id="fName" placeholder="Buscar carta…" maxlength="100">
            </div>
            <div class="field filters-toggle-wrap">
                <button type="button" id="filtersToggle" class="col-btn quiet" aria-expanded="false" aria-controls="filtersMore">Más filtros</button>
            </div>
            <div class="filters-more" id="filtersMore">
            <div class="field">
                <label for="fType">Tipo</label>
                <select id="fType"><option value="">Cualquier tipo</option></select>
            </div>
            <div class="field">
                <label for="fSubtype">Subtipo</label>
                <select id="fSubtype" disabled><option value="">Cualquier subtipo</option></select>
            </div>
            <div class="field wide">
                <label for="fContainer">Contenedor</label>
                <select id="fContainer"><option value="">Todos los contenedores</option></select>
            </div>
            <div class="field">
                <label for="fRarity">Rareza</label>
                <select id="fRarity">
                    <option value="">Cualquier rareza</option>
                    <option value="common">Común</option>
                    <option value="uncommon">Poco común</option>
                    <option value="rare">Rara</option>
                    <option value="mythic">Mítica</option>
                </select>
            </div>
            <div class="field">
                <label for="fSet">Set</label>
                <input type="search" id="fSet" placeholder="Nombre o código" maxlength="60">
            </div>
            <div class="field">
                <label for="fFoil">Acabado</label>
                <select id="fFoil">
                    <option value="">Foil y no foil</option>
                    <option value="true">Solo foil</option>
                    <option value="false">Sin foil</option>
                </select>
            </div>
            <div class="field">
                <label for="fSort">Ordenar por</label>
                <div class="sort-group">
                    <select id="fSort">
                        <option value="name">Nombre</option>
                        <option value="quantity">Número de copias</option>
                        <option value="recent">Añadidas recientemente</option>
                        <option value="type">Tipo</option>
                        <option value="rarity">Rareza</option>
                        <option value="printings">Número de artes</option>
                    </select>
                    <button type="button" id="orderBtn" class="col-btn icon" aria-label="Orden ascendente" title="Cambiar sentido del orden">↑</button>
                </div>
            </div>
            <div class="field actions">
                <button type="button" id="resetBtn" class="col-btn quiet">Limpiar filtros</button>
            </div>
            </div>
        </form>

        <!-- Resultados -->
        <div class="results-bar">
            <p id="resultsInfo" class="muted" aria-live="polite">Cargando colección…</p>
            <div class="page-size">
                <label for="fPageSize">Cartas por página</label>
                <select id="fPageSize">
                    <option value="12">12</option>
                    <option value="24">24</option>
                    <option value="48">48</option>
                    <option value="96">96</option>
                </select>
            </div>
        </div>

        <p id="containerBanner" class="banner" hidden></p>

        <div id="statusBox" class="status-box" hidden></div>

        <ul id="cardGrid" class="card-grid" aria-busy="true"></ul>

        <nav id="pager" class="pager" aria-label="Paginación de la colección"></nav>
    </main>

    <!-- Detalle de carta -->
    <dialog id="detailDialog" class="col-dialog detail" aria-labelledby="detailTitle">
        <button type="button" class="dlg-close" data-close aria-label="Cerrar detalle">✕</button>
        <div id="detailBody"></div>
    </dialog>

    <!-- Importar -->
    <dialog id="importDialog" class="col-dialog narrow" aria-labelledby="importTitle">
        <button type="button" class="dlg-close" data-close aria-label="Cerrar importación">✕</button>
        <h2 id="importTitle">Importar colección</h2>
        <div id="importBody"></div>
    </dialog>

    <!-- Imprimir -->
    <dialog id="printDialog" class="col-dialog narrow" aria-labelledby="printTitle">
        <button type="button" class="dlg-close" data-close aria-label="Cerrar impresión">✕</button>
        <h2 id="printTitle">Imprimir informe</h2>
        <div id="printBody"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <!-- Contenido que se imprime (oculto en pantalla) -->
    <div id="printReport" aria-hidden="true"></div>

    <script src="js/shared/section-nav.js" data-section="coleccion"></script>
    <script src="js/pages/coleccion.js"></script>
</body>
</html>
