<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro - Selector de Salas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0705; color: #fef3c7; }
        .magic-title { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Cabecera principal -->
    <div class="w-full max-w-3xl text-center mb-8">
        <h1 class="magic-title text-3xl md:text-4xl text-amber-400 font-bold mb-2">⚔️ Salas de Duelo - Card Binder</h1>
        <p class="text-xs md:text-sm text-amber-200/70">Elige una sala activa para unirte o crea tu propio campo de batalla.</p>
    </div>

    <!-- Panel de Creación y Listado -->
    <div class="w-full max-w-3xl grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Columna Izquierda: Crear Sala -->
        <div class="bg-[#140e09] border border-[#b39258]/40 rounded-2xl p-6 shadow-2xl flex flex-col justify-between">
            <div>
                <h2 class="magic-title text-sm font-bold text-amber-400 mb-4 uppercase tracking-wider">🏰 Crear Sala</h2>
                <form id="create-room-form" class="space-y-4">
                    <div>
                        <label class="block text-[11px] text-amber-200/70 mb-1">Nombre de tu Mago/Jugador:</label>
                        <input type="text" id="username-input" required placeholder="Tu nombre..."
                            class="w-full bg-[#0b0705] border border-[#b39258]/30 text-amber-100 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-[11px] text-amber-200/70 mb-1">Nombre de la Sala:</label>
                        <input type="text" id="room-name-input" required placeholder="ej. DueloLegendario"
                            class="w-full bg-[#0b0705] border border-[#b39258]/30 text-amber-100 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-amber-400">
                    </div>
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-3 px-4 rounded-xl text-xs transition-all shadow-lg cursor-pointer">
                        ✨ Crear y Entrar
                    </button>
                </form>
            </div>
        </div>

        <!-- Columna Derecha: Listado de Salas Activas -->
        <div class="md:col-span-2 bg-[#140e09] border border-[#b39258]/40 rounded-2xl p-6 shadow-2xl flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="magic-title text-sm font-bold text-amber-400 uppercase tracking-wider">📜 Salas Abiertas</h2>
                    <button id="refresh-btn" class="text-xs text-amber-200/70 hover:text-amber-400 underline cursor-pointer">Actualizar</button>
                </div>

                <!-- Contenedor de la lista de salas -->
                <div id="rooms-list" class="space-y-3 max-h-[300px] overflow-y-auto pr-1">
                    <div class="text-xs text-amber-200/40 italic text-center py-8">Buscando campos de batalla activos...</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Script de gestión de salas -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const roomsList = document.getElementById("rooms-list");
            const createRoomForm = document.getElementById("create-room-form");
            const usernameInput = document.getElementById("username-input");
            const roomNameInput = document.getElementById("room-name-input");
            const refreshBtn = document.getElementById("refresh-btn");

            // Cargar usuario guardado previamente si existe
            const savedSession = JSON.parse(localStorage.getItem("user_session")) || 
                                 JSON.parse(localStorage.getItem("cardbinder_user"));
            if (savedSession && savedSession.username) {
                usernameInput.value = savedSession.username;
            } else {
                usernameInput.value = "Conjurador_" + Math.floor(Math.random() * 1000);
            }

            async function fetchActiveRooms() {
                try {
                    const response = await fetch("http://localhost:8000/api/game/rooms");
                    const data = await response.json();
                    renderRooms(data.rooms);
                } catch (error) {
                    console.error("Error al obtener las salas:", error);
                    roomsList.innerHTML = `<div class="text-xs text-red-400 text-center py-4">Error al conectar con el servidor.</div>`;
                }
            }

            function renderRooms(rooms) {
                roomsList.innerHTML = "";
                if (!rooms || rooms.length === 0) {
                    roomsList.innerHTML = `<div class="text-xs text-amber-200/40 italic text-center py-8">No hay salas abiertas en este momento. ¡Crea una!</div>`;
                    return;
                }

                rooms.forEach(room => {
                    const div = document.createElement("div");
                    div.className = "flex justify-between items-center bg-[#0b0705] border border-[#b39258]/20 p-3 rounded-xl text-xs";

                    const infoDiv = document.createElement("div");
                    infoDiv.innerHTML = `
                        <div class="font-bold text-amber-200 text-sm mb-0.5">🏛️ ${room.room_id}</div>
                        <div class="text-[11px] text-amber-200/60">Ocupación: <span class="text-emerald-400 font-semibold">${room.current_players}/${room.max_players}</span> jugadores</div>
                    `;

                    const joinBtn = document.createElement("button");
                    joinBtn.className = "bg-emerald-700 hover:bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-xs transition-all cursor-pointer";
                    joinBtn.textContent = "Unirse";
                    
                    joinBtn.addEventListener("click", () => {
                        const username = usernameInput.value.trim() || "Conjurador";
                        localStorage.setItem("user_session", JSON.stringify({ username }));
                        window.location.href = `lobby.html?room=${encodeURIComponent(room.room_id)}`;
                    });

                    div.appendChild(infoDiv);
                    div.appendChild(joinBtn);
                    roomsList.appendChild(div);
                });
            }

            createRoomForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const username = usernameInput.value.trim();
                const roomName = roomNameInput.value.trim();
                if (!username || !roomName) return;

                localStorage.setItem("user_session", JSON.stringify({ username }));
                window.location.href = `lobby.html?room=${encodeURIComponent(roomName)}`;
            });

            refreshBtn.addEventListener("click", fetchActiveRooms);

            // Cargar salas al iniciar y actualizar cada 5 segundos automáticamente
            fetchActiveRooms();
            setInterval(fetchActiveRooms, 5000);
        });
    </script>
</body>
</html>
