<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🃏%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro - Adivina la Carta</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="css/game.css">
    <script src="js/shared/theme.js"></script>
</head>
<body class="font-ui min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Cabecera y Marcador propio -->
    <div class="w-full max-w-xl flex justify-between items-center mb-4 bg-[rgb(var(--c-panel))] border border-[rgb(var(--c-gold)/0.3)] p-4 rounded-xl shadow-lg">
        <div>
            <h1 class="magic-title text-xl text-[rgb(var(--c-amber-400))] font-bold">🔮 Adivina la Carta</h1>
            <p id="room-status" class="text-xs text-[rgb(var(--c-amber-200)/0.6)]">Conectando a la sala...</p>
            <button id="leave-game-btn" type="button" class="mt-1 text-[11px] font-bold text-red-300 hover:text-red-200 underline">🚪 Abandonar partida</button>
            <p class="text-[10px] text-[rgb(var(--c-amber-200)/0.5)]">Ronda <span id="round-number">–</span></p>
        </div>
        <div class="text-right">
            <span class="text-xs text-[rgb(var(--c-amber-200)/0.7)]">Puntuación:</span>
            <span id="player-score" class="text-2xl font-bold text-emerald-400 ml-2">0</span>
            <div class="text-[10px] text-[rgb(var(--c-amber-300))]">Racha: <span id="player-streak">0</span>x</div>
        </div>
    </div>

    <!-- Marcador de todos los jugadores -->
    <div class="w-full max-w-xl mb-4 bg-[rgb(var(--c-panel))] border border-[rgb(var(--c-gold)/0.3)] p-4 rounded-xl shadow-lg">
        <h2 class="magic-title text-xs font-bold text-[rgb(var(--c-amber-400))] mb-2 uppercase tracking-wider">
            🏆 Marcador <span class="text-[rgb(var(--c-amber-200)/0.5)] normal-case font-normal">(meta: <span id="win-score">10</span> pts)</span>
        </h2>
        <ul id="scoreboard" class="space-y-2">
            <li class="text-xs text-[rgb(var(--c-amber-200)/0.4)] italic">Esperando jugadores...</li>
        </ul>
    </div>

    <!-- Contenedor del Juego -->
    <div class="w-full max-w-xl bg-[rgb(var(--c-panel))] border border-[rgb(var(--c-gold)/0.4)] rounded-2xl p-6 shadow-2xl flex flex-col items-center">

        <div class="w-full flex justify-between text-xs text-[rgb(var(--c-amber-200))] mb-2">
            <span>⏱️ Tiempo restante:</span>
            <span id="timer" class="font-bold text-[rgb(var(--c-amber-400))] text-sm">Conectando…</span>
        </div>
        <div class="w-full bg-[rgb(var(--c-ink))] h-2 rounded-full mb-6 overflow-hidden border border-[rgb(var(--c-gold)/0.2)]">
            <div id="timer-bar" data-level="ok"></div>
        </div>

        <div class="card-wrapper rounded-lg overflow-hidden border-2 border-[rgb(var(--c-gold)/0.5)] shadow-md mb-4 bg-black">
            <div id="title-mask" class="title-black-box"></div>
            <img id="game-card-img" src="public/assets/nocapi.png" alt="Carta oculta">
        </div>

        <!-- Mensaje de resultado de la ronda -->
        <p id="round-banner" class="min-h-[1.25rem] text-sm text-[rgb(var(--c-amber-200))] text-center mb-4"></p>

        <div id="options-container" class="w-full grid grid-cols-1 gap-3">
            <button class="option-btn" data-state="idle" disabled>Esperando opciones del servidor…</button>
        </div>
    </div>

    <!-- Fin de partida -->
    <div id="end-overlay" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4">
        <div class="bg-[rgb(var(--c-panel))] border border-[rgb(var(--c-gold)/0.5)] rounded-2xl p-8 text-center max-w-sm w-full shadow-2xl">
            <h2 class="magic-title text-2xl text-[rgb(var(--c-amber-400))] mb-2">🏆 ¡Fin de la partida!</h2>
            <p id="end-winner" class="text-[rgb(var(--c-amber-100))] mb-4"></p>
            <ol id="end-ranking" class="mb-4 text-left"></ol>
            <p class="text-xs text-[rgb(var(--c-amber-200)/0.6)]">Volviendo al vestíbulo en <span id="end-countdown">6</span>s…</p>
        </div>
    </div>

    <script src="js/pages/game.js?v=4"></script>
    <script src="js/shared/footer.js"></script>
</body>
</html>
