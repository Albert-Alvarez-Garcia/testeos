<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🃏%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder - Home</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="css/index.css">
    <!-- Tema azulado de 42 (fondo y colores): lo activa theme.js si el usuario es de 42 -->
    <script src="js/shared/theme.js"></script>
    <script src="js/pages/index.js"></script>
    <script src="js/shared/user-menu.js"></script>
</head>
<body class="min-h-screen w-full flex flex-col justify-between py-6 px-6 relative select-none overflow-hidden">

    <!-- El menú de usuario y el panel de medallas los crea js/shared/user-menu.js -->

    <!-- ILUSTRACIÓN CENTRAL DECORATIVA (DECO1) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 overflow-hidden">
        <img src="public/assets/deco1.png" alt="Decorative Character" class="hero-illustration h-full max-h-[90vh] w-auto object-contain translate-y-24">
    </div>

    <!-- HEADER / ICONOS DE MANÁ CON TOOLTIPS FUNCIONALES -->
    <div class="w-full flex justify-center items-center z-30 pt-24">
        <div class="flex items-center space-x-4">
            
            <!-- MANÁ BLANCO: Mi colección (buscar, ver, añadir y organizar) -->
            <div class="relative group">
                <a href="hub-coleccion.html" class="metal-orb w-24 h-24 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 hover:scale-110 overflow-hidden p-1.5 inline-block" title="Blanco">
                    <img src="public/assets/blanco-removebg-preview.png" alt="White Mana" class="w-full h-full object-contain drop-shadow-md">
                </a>
                <div class="absolute top-14 left-1/2 -translate-x-1/2 w-48 bg-[rgb(var(--c-panel)/0.95)] border-2 border-[rgb(var(--c-gold))] text-[rgb(var(--c-amber-200))] text-xs p-2.5 rounded-lg shadow-2xl text-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-sans z-50">
                    Mi colección: ver, añadir y organizar tus cartas.
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[rgb(var(--c-panel))] border-t-2 border-l-2 border-[rgb(var(--c-gold))] rotate-45"></div>
                </div>
            </div>
            
            <!-- MANÁ AZUL: Juegos (Adivina la carta y Pong) -->
            <div class="relative group">
                <a href="hub-juegos.html" class="metal-orb w-24 h-24 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 hover:scale-110 overflow-hidden p-1.5 inline-block" title="Azul">
                    <img src="public/assets/azul-removebg-preview.png" alt="Blue Mana" class="w-full h-full object-contain drop-shadow-md">
                </a>
                <div class="absolute top-14 left-1/2 -translate-x-1/2 w-48 bg-[rgb(var(--c-panel)/0.95)] border-2 border-[rgb(var(--c-gold))] text-[rgb(var(--c-amber-200))] text-xs p-2.5 rounded-lg shadow-2xl text-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-sans z-50">
                    Juegos: Adivina la carta y Pong.
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[rgb(var(--c-panel))] border-t-2 border-l-2 border-[rgb(var(--c-gold))] rotate-45"></div>
                </div>
            </div>

            <!-- MANÁ ROJO: cartas locas -->
            <a href="gacha.html" class="relative group block cursor-pointer">
                <button class="metal-orb w-24 h-24 rounded-full flex items-center justify-center pointer-events-none transition-all duration-300 hover:scale-110 overflow-hidden p-1.5" title="Rojo">
                    <img src="public/assets/rojo-removebg-preview.png" alt="Red Mana" class="w-full h-full object-contain drop-shadow-md">
                </button>
                <div class="absolute top-14 left-1/2 -translate-x-1/2 w-48 bg-[rgb(var(--c-panel)/0.95)] border-2 border-[rgb(var(--c-gold))] text-[rgb(var(--c-amber-200))] text-xs p-2.5 rounded-lg shadow-2xl text-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-sans z-50">
                    Abrir sobres.
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[rgb(var(--c-panel))] border-t-2 border-l-2 border-[rgb(var(--c-gold))] rotate-45"></div>
                </div>
            </a>
            
            <!-- MANÁ VERDE: Parte social de la web (Sala de Chat Global) -->
            <div class="relative group">
                <button id="chat-float-btn" class="metal-orb w-24 h-24 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 hover:scale-110 overflow-hidden p-1.5" title="Sala Global de Chat">
                    <img src="public/assets/verde-removebg-preview.png" alt="Green Mana" class="w-full h-full object-contain drop-shadow-md">
                </button>
                <div class="absolute top-14 left-1/2 -translate-x-1/2 w-48 bg-[rgb(var(--c-panel)/0.95)] border-2 border-[rgb(var(--c-gold))] text-[rgb(var(--c-amber-200))] text-xs p-2.5 rounded-lg shadow-2xl text-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-sans z-50">
                    Abrir Sala de Chat Global.
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[rgb(var(--c-panel))] border-t-2 border-l-2 border-[rgb(var(--c-gold))] rotate-45"></div>
                </div>
            </div>

            <!-- MANÁ NEGRO: README del proyecto (explicación técnica) -->
            <a href="readme.html" class="relative group block cursor-pointer">
                <span class="metal-orb w-24 h-24 rounded-full flex items-center justify-center transition-all duration-300 hover:scale-110 overflow-hidden p-1.5" title="Negro">
                    <img src="public/assets/negro-removebg-preview.png" alt="Black Mana" class="w-full h-full object-contain drop-shadow-md">
                </span>
                <div class="absolute top-14 left-1/2 -translate-x-1/2 w-48 bg-[rgb(var(--c-panel)/0.95)] border-2 border-[rgb(var(--c-gold))] text-[rgb(var(--c-amber-200))] text-xs p-2.5 rounded-lg shadow-2xl text-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-sans z-50">
                    Sobre el proyecto: cómo funciona por dentro.
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[rgb(var(--c-panel))] border-t-2 border-l-2 border-[rgb(var(--c-gold))] rotate-45"></div>
                </div>
            </a>

        </div>
    </div>

    <!-- CENTRO: Logo grande -->
    <div class="my-auto text-center relative z-25 flex flex-col items-center translate-y-24">
        <!-- Logo central -->
        <div class="px-6 py-2 relative flex items-center justify-center">
            <img src="public/assets/logomagic.png" alt="Card Binder Logo" class="relative z-25 max-h-56 w-auto object-contain drop-shadow-[0_4px_20px_rgba(0,0,0,0.95)]">
        </div>
    </div>

    <!-- ESPACIADOR INFERIOR -->
    <div class="h-10"></div>

    <!-- Logo de 42 (solo para usuarios de 42), abajo a la derecha -->
    <div id="logo-42" class="hidden fixed bottom-6 right-6 z-30 p-2.5 rounded-xl bg-[rgb(var(--c-panel)/0.8)] border border-[rgb(var(--c-gold)/0.5)] shadow-2xl backdrop-blur-md pointer-events-none">
        <img src="public/assets/42_Logo.svg" alt="42" class="h-9 w-auto block">
    </div>

    <!-- 💬 COMPONENTE DE SALA DE CHAT GLOBAL (OCULTO POR DEFECTO) -->
    <div id="chat-box" class="fixed bottom-24 right-6 w-80 md:w-96 h-[450px] bg-[rgb(var(--c-panel)/0.95)] border-2 border-[rgb(var(--c-gold))] rounded-2xl shadow-2xl backdrop-blur-md hidden flex-col z-50 overflow-hidden font-sans">
        <!-- Cabecera del Chat -->
        <div class="bg-[rgb(var(--c-panel-2))] border-b border-[rgb(var(--c-gold)/0.4)] px-4 py-3 flex justify-between items-center text-[rgb(var(--c-amber-100))]">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                <span class="font-bold tracking-wide text-sm">Sala Global de Conjuradores 🌐</span>
            </div>
            <button id="chat-close-btn" class="text-[rgb(var(--c-amber-400))] hover:text-white transition-colors cursor-pointer text-lg font-bold px-1">✕</button>
        </div>

        <!-- Contenedor de Mensajes -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col bg-[rgb(var(--c-ink-2)/0.6)] text-sm">
            <!-- Los mensajes se inyectarán dinámicamente aquí -->
        </div>

        <!-- Formulario de Entrada -->
        <form id="chat-form" class="bg-[rgb(var(--c-panel-2))] border-t border-[rgb(var(--c-gold)/0.4)] p-3 flex items-center space-x-2 relative">
            
            <!-- 🌟 BOTÓN Y PANEL FLOTANTE DE GIPHY SEARCH -->
            <div class="relative">
                <button type="button" id="sticker-toggle-btn" class="bg-[rgb(var(--c-gold)/0.2)] hover:bg-[rgb(var(--c-gold)/0.4)] border border-[rgb(var(--c-gold)/0.6)] text-[rgb(var(--c-amber-200))] px-2.5 py-2 rounded-xl text-xs transition-colors cursor-pointer" title="Buscar GIF">
                    ✨ GIF
                </button>
                
                <!-- Panel flotante del buscador de Giphy -->
                <div id="sticker-picker" class="absolute bottom-12 left-0 w-64 bg-[rgb(var(--c-panel-2))] border-2 border-[rgb(var(--c-gold))] rounded-xl p-3 shadow-2xl hidden flex flex-col space-y-2 z-50 font-sans">
                    <input type="text" id="giphy-search-input" placeholder="Buscar GIF (ej. magic, fire)..." autocomplete="off" class="bg-[rgb(var(--c-panel))] border border-[rgb(var(--c-gold)/0.6)] rounded-lg px-2.5 py-1.5 text-[rgb(var(--c-amber-100))] text-xs focus:outline-hidden focus:border-[rgb(var(--c-amber-400))]" />
                    
                    <div id="giphy-results" class="grid grid-cols-3 gap-1.5 max-h-40 overflow-y-auto">
                        <span class="chat-hint">Escribe algo para buscar...</span>
                    </div>

                    <!-- 🏷️ LOGOTIPO DE ATRIBUCIÓN OBLIGATORIO DE GIPHY -->
                    <div class="pt-1.5 border-t border-[rgb(var(--c-gold)/0.3)] flex justify-center items-center">
                        <img src="public/assets/Poweredby_100px-Black_VertLogo.png" alt="Powered by Giphy" class="h-4 opacity-75 object-contain" />
                    </div>
                </div>
            </div>

            <input type="text" id="chat-input" placeholder="Escribe un mensaje a la comunidad..." autocomplete="off" class="flex-1 bg-[rgb(var(--c-panel))] border border-[rgb(var(--c-gold)/0.6)] rounded-xl px-3 py-2 text-[rgb(var(--c-amber-100))] text-xs focus:outline-hidden focus:border-[rgb(var(--c-amber-400))]" required />
            <button type="submit" class="bg-[rgb(var(--c-gold)/0.3)] hover:bg-[rgb(var(--c-gold)/0.6)] border border-[rgb(var(--c-gold))] text-[rgb(var(--c-amber-200))] px-4 py-2 rounded-xl text-xs font-semibold transition-colors cursor-pointer">
                Enviar
            </button>
        </form>
    </div>

    <script src="js/shared/chat.js"></script>
    <script src="js/shared/footer.js"></script>
</body>
</html>
