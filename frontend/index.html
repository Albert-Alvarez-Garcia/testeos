<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder - Home</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="portal.css">
</head>
<body class="min-h-screen w-full flex flex-col justify-between py-6 px-6 relative select-none overflow-hidden">

    <!-- 👤 MENÚ DE USUARIO ACTIVO (SUPERIOR DERECHA) -->
    <div id="user-menu" class="absolute top-6 right-6 z-40 flex items-center space-x-3 bg-[#140e09]/90 border border-[#b39258]/60 px-4 py-2 rounded-xl shadow-2xl backdrop-blur-md">
        <!-- Se rellenará dinámicamente mediante JavaScript -->
    </div>

    <!-- 🏅 PANEL DE MEDALLAS / LOGROS (se abre desde el botón Logros) -->
    <div id="achievements-panel" class="absolute top-24 right-6 z-40 w-80 hidden bg-[#140e09]/95 border-2 border-[#b39258] rounded-2xl shadow-2xl backdrop-blur-md p-4 font-sans">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-amber-200 font-bold text-sm tracking-wide">🏅 Medallas</h2>
            <span id="achievements-summary" class="text-xs text-amber-300/70"></span>
        </div>
        <div id="achievements-grid" class="medal-grid"></div>
    </div>

    <!-- ILUSTRACIÓN CENTRAL DECORATIVA (DECO1) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 overflow-hidden">
        <img src="public/assets/deco1.png" alt="Decorative Character" class="hero-illustration h-full max-h-[90vh] w-auto object-contain">
    </div>

    <!-- HEADER / ICONOS DE MANÁ CON TOOLTIPS FUNCIONALES -->
    <div class="w-full flex justify-center items-center z-30 pt-2">
        <div class="flex items-center space-x-4">
            
            <!-- MANÁ BLANCO: Mi colección (buscar, ver, añadir y organizar) -->
            <div class="relative group">
                <a href="hub-coleccion.html" class="metal-orb w-24 h-24 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 hover:scale-110 overflow-hidden p-1.5 inline-block" title="Blanco">
                    <img src="public/assets/blanco-removebg-preview.png" alt="White Mana" class="w-full h-full object-contain drop-shadow-md">
                </a>
                <div class="absolute top-14 left-1/2 -translate-x-1/2 w-48 bg-[#140e09]/95 border-2 border-[#b39258] text-amber-200 text-xs p-2.5 rounded-lg shadow-2xl text-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-sans z-50">
                    Mi colección: ver, añadir y organizar tus cartas.
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[#140e09] border-t-2 border-l-2 border-[#b39258] rotate-45"></div>
                </div>
            </div>
            
            <!-- MANÁ AZUL: Juegos (Adivina la carta y Pong) -->
            <div class="relative group">
                <a href="hub-juegos.html" class="metal-orb w-24 h-24 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 hover:scale-110 overflow-hidden p-1.5 inline-block" title="Azul">
                    <img src="public/assets/azul-removebg-preview.png" alt="Blue Mana" class="w-full h-full object-contain drop-shadow-md">
                </a>
                <div class="absolute top-14 left-1/2 -translate-x-1/2 w-48 bg-[#140e09]/95 border-2 border-[#b39258] text-amber-200 text-xs p-2.5 rounded-lg shadow-2xl text-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-sans z-50">
                    Juegos: Adivina la carta y Pong.
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[#140e09] border-t-2 border-l-2 border-[#b39258] rotate-45"></div>
                </div>
            </div>

            <!-- MANÁ ROJO: cartas locas -->
            <a href="gacha.html" class="relative group block cursor-pointer">
                <button class="metal-orb w-24 h-24 rounded-full flex items-center justify-center pointer-events-none transition-all duration-300 hover:scale-110 overflow-hidden p-1.5" title="Rojo">
                    <img src="public/assets/rojo-removebg-preview.png" alt="Red Mana" class="w-full h-full object-contain drop-shadow-md">
                </button>
                <div class="absolute top-14 left-1/2 -translate-x-1/2 w-48 bg-[#140e09]/95 border-2 border-[#b39258] text-amber-200 text-xs p-2.5 rounded-lg shadow-2xl text-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-sans z-50">
                    Abrir sobres.
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[#140e09] border-t-2 border-l-2 border-[#b39258] rotate-45"></div>
                </div>
            </a>
            
            <!-- MANÁ VERDE: Parte social de la web (Sala de Chat Global) -->
            <div class="relative group">
                <button id="chat-toggle-btn" class="metal-orb w-24 h-24 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 hover:scale-110 overflow-hidden p-1.5" title="Sala Global de Chat">
                    <img src="public/assets/verde-removebg-preview.png" alt="Green Mana" class="w-full h-full object-contain drop-shadow-md">
                </button>
                <div class="absolute top-14 left-1/2 -translate-x-1/2 w-48 bg-[#140e09]/95 border-2 border-[#b39258] text-amber-200 text-xs p-2.5 rounded-lg shadow-2xl text-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-sans z-50">
                    Abrir Sala de Chat Global.
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[#140e09] border-t-2 border-l-2 border-[#b39258] rotate-45"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- CENTRO: Logo grande -->
    <div class="my-auto text-center relative z-25 flex flex-col items-center">
        <!-- Logo central -->
        <div class="px-6 py-2 relative flex items-center justify-center">
            <img src="public/assets/logomagic.png" alt="Card Binder Logo" class="relative z-25 max-h-56 w-auto object-contain drop-shadow-[0_4px_20px_rgba(0,0,0,0.95)]">
        </div>
    </div>

    <!-- ESPACIADOR INFERIOR -->
    <div class="h-10"></div>

    <!-- 💬 COMPONENTE DE SALA DE CHAT GLOBAL (OCULTO POR DEFECTO) -->
    <div id="chat-box" class="fixed bottom-24 right-6 w-80 md:w-96 h-[450px] bg-[#140e09]/95 border-2 border-[#b39258] rounded-2xl shadow-2xl backdrop-blur-md hidden flex-col z-50 overflow-hidden font-sans">
        <!-- Cabecera del Chat -->
        <div class="bg-[#1a120b] border-b border-[#b39258]/40 px-4 py-3 flex justify-between items-center text-amber-100">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                <span class="font-bold tracking-wide text-sm">Sala Global de Conjuradores 🌐</span>
            </div>
            <button id="chat-close-btn" class="text-amber-400 hover:text-white transition-colors cursor-pointer text-lg font-bold px-1">✕</button>
        </div>

        <!-- Contenedor de Mensajes -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col space-y-3 bg-[#0d0906]/60 text-sm">
            <!-- Los mensajes se inyectarán dinámicamente aquí -->
        </div>

        <!-- Formulario de Entrada -->
        <form id="chat-form" class="bg-[#1a120b] border-t border-[#b39258]/40 p-3 flex items-center space-x-2 relative">
            
            <!-- 🌟 BOTÓN Y PANEL FLOTANTE DE GIPHY SEARCH -->
            <div class="relative">
                <button type="button" id="sticker-toggle-btn" class="bg-[#b39258]/20 hover:bg-[#b39258]/40 border border-[#b39258]/60 text-amber-200 px-2.5 py-2 rounded-xl text-xs transition-colors cursor-pointer" title="Buscar GIF">
                    ✨ GIF
                </button>
                
                <!-- Panel flotante del buscador de Giphy -->
                <div id="sticker-picker" class="absolute bottom-12 left-0 w-64 bg-[#1a120b] border-2 border-[#b39258] rounded-xl p-3 shadow-2xl hidden flex flex-col space-y-2 z-50 font-sans">
                    <input type="text" id="giphy-search-input" placeholder="Buscar GIF (ej. magic, fire)..." autocomplete="off" class="bg-[#140e09] border border-[#b39258]/60 rounded-lg px-2.5 py-1.5 text-amber-100 text-xs focus:outline-none focus:border-amber-400" />
                    
                    <div id="giphy-results" class="grid grid-cols-3 gap-1.5 max-h-40 overflow-y-auto">
                        <span class="text-[10px] text-amber-200/50 col-span-3 text-center py-4">Escribe algo para buscar...</span>
                    </div>

                    <!-- 🏷️ LOGOTIPO DE ATRIBUCIÓN OBLIGATORIO DE GIPHY -->
                    <div class="pt-1.5 border-t border-[#b39258]/30 flex justify-center items-center">
                        <img src="public/assets/Poweredby_100px-Black_VertLogo.png" alt="Powered by Giphy" class="h-4 opacity-75 object-contain" />
                    </div>
                </div>
            </div>

            <input type="text" id="chat-input" placeholder="Escribe un mensaje a la comunidad..." autocomplete="off" class="flex-1 bg-[#140e09] border border-[#b39258]/60 rounded-xl px-3 py-2 text-amber-100 text-xs focus:outline-none focus:border-amber-400" required />
            <button type="submit" class="bg-[#b39258]/30 hover:bg-[#b39258]/60 border border-[#b39258] text-amber-200 px-4 py-2 rounded-xl text-xs font-semibold transition-colors cursor-pointer">
                Enviar
            </button>
        </form>
    </div>

    <!-- SCRIPT DE GESTIÓN DE SESIÓN Y CHAT (CON BUSCADOR GIPHY INTEGRADO) -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {

        let userData = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // ==========================================
        // LOGIN MEDIANTE 42
        // ==========================================
        const params = new URLSearchParams(window.location.search);
        const auth42 = params.get('auth42');

        if (auth42) {
            try {
                const decodedUser = decodeURIComponent(
                    escape(atob(auth42))
                );

                userData = JSON.parse(decodedUser);

                localStorage.setItem(
                    'cardbinder_user',
                    JSON.stringify(userData)
                );

                window.history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );

            } catch (error) {
                console.error('Error procesando la autenticación de 42:', error);
                localStorage.removeItem('cardbinder_user');
                window.location.href = 'login.html';
                return;
            }
        }

        // ==========================================
        // SESIÓN NORMAL
        // ==========================================
        if (!userData) {
            const storedUser = localStorage.getItem('cardbinder_user');
            if (storedUser) {
                try {
                    userData = JSON.parse(storedUser);
                } catch (error) {
                    console.error('Error leyendo la sesión:', error);
                    localStorage.removeItem('cardbinder_user');
                }
            }
        }

        // ==========================================
        // COMPROBAR SESIÓN
        // ==========================================
        const userMenuContainer = document.getElementById('user-menu');

        if (!userData) {
            window.location.href = 'login.html';
            return;
        }

        // ==========================================
        // PINTAR USUARIO
        // ==========================================
        if (userMenuContainer) {
            userMenuContainer.innerHTML = `
                <div class="flex items-center space-x-2 text-amber-100 text-sm font-sans">
                    <span class="font-semibold text-amber-400">
                        ${escapeHtml(userData.username)}
                    </span>
                    <span class="text-xs px-2 py-0.5 rounded
                        bg-[#b39258]/20
                        border border-[#b39258]/40
                        text-amber-300">
                        (${escapeHtml(userData.badge)})
                    </span>
                </div>
                <div class="flex items-center space-x-2 pl-2 border-l border-[#b39258]/40">
                    <div class="relative">
                        <button id="notif-btn" type="button" aria-label="Notificaciones" aria-expanded="false"
                            class="relative px-1.5 text-lg text-amber-300 hover:text-amber-100 transition-colors cursor-pointer">
                            🔔
                            <span id="notif-count" class="hidden absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[10px] font-bold items-center justify-center"></span>
                        </button>
                        <div id="notif-menu" class="hidden absolute right-0 top-full mt-3 w-72 max-h-80 overflow-y-auto bg-[#140e09]/95 border-2 border-[#b39258] rounded-2xl shadow-2xl backdrop-blur-md p-3 space-y-2 font-sans z-50"></div>
                    </div>
                    <button
                        id="profile-btn"
                        class="px-2.5 py-1 text-xs font-medium rounded
                        bg-[#b39258]/30
                        hover:bg-[#b39258]/50
                        text-amber-200
                        transition-colors
                        cursor-pointer">
                        Logros
                    </button>
                    <a
                        href="profile.html"
                        class="px-2.5 py-1 text-xs font-medium rounded
                        bg-[#b39258]/30
                        hover:bg-[#b39258]/50
                        text-amber-200
                        transition-colors
                        cursor-pointer">
                        Perfil
                    </a>
                    <button
                        id="logout-btn"
                        class="px-2.5 py-1 text-xs font-medium rounded
                        bg-red-950/60
                        hover:bg-red-900
                        text-red-200
                        border border-red-800/50
                        transition-colors
                        cursor-pointer">
                        Salir
                    </button>
                </div>
            `;

            // Avatar (debe ir DESPUÉS de innerHTML, que si no lo sobrescribe):
            // imagen de 42 si existe; si no (o si falla la carga), círculo con la inicial.
            const initial = (userData.username || '?').trim().charAt(0).toUpperCase() || '?';

            function buildInitialAvatar() {
                const div = document.createElement('div');
                div.className = 'avatar-initial';
                div.textContent = initial;
                div.title = userData.username || '';
                return div;
            }

            const API_BASE = 'http://localhost:8000';

            // El backend descarga el avatar y lo sirve desde /api/auth/avatar/<usuario>; las URLs
            // de 42 quedan como alternativa. Se prueban en orden y, si ninguna carga, se usa la inicial.
            const resolveAvatarUrl = (u) =>
                (typeof u === 'string' && u.startsWith('/api/')) ? API_BASE + u : u;

            const localAvatar = (u) => typeof u === 'string' && u.startsWith('/api/');

            // Si el usuario ya tiene un avatar guardado en el servidor (el que eligió o el de 42 ya descargado),
            // se usa SOLO ese. Las imágenes del CDN de 42 únicamente se intentan si no tiene ninguno.
            function avatarCandidatesFor(u) {
                const list = localAvatar(u.avatar) ? [u.avatar] : [
                    u.avatar,
                    ...(Array.isArray(u.avatar_fallbacks) ? u.avatar_fallbacks : []),
                    u.image_url,
                    u.picture,
                    u.image && u.image.link,
                    u.image && u.image.versions && u.image.versions.medium
                ];
                return list.map(resolveAvatarUrl)
                    .filter((x, i, arr) => typeof x === 'string' &&
                        (/^https:\/\//.test(x) || x.startsWith(API_BASE + '/api/')) &&
                        arr.indexOf(x) === i);
            }

            let avatarEl = null;
            function renderAvatar(urls) {
                let next;
                if (urls.length) {
                    let attempt = 0;
                    const img = document.createElement('img');
                    img.alt = userData.username || '';
                    img.referrerPolicy = 'no-referrer';
                    img.className = 'avatar-img';
                    img.addEventListener('error', () => {
                        attempt += 1;
                        if (attempt < urls.length) { img.src = urls[attempt]; return; }
                        const initialEl = buildInitialAvatar();
                        img.replaceWith(initialEl);
                        if (avatarEl === img) avatarEl = initialEl;
                    });
                    img.src = urls[0];
                    next = img;
                } else {
                    next = buildInitialAvatar();
                }
                if (avatarEl && avatarEl.isConnected) avatarEl.replaceWith(next);
                else userMenuContainer.prepend(next);
                avatarEl = next;
            }
            renderAvatar(avatarCandidatesFor(userData));

            // El servidor es quien sabe cuál es el avatar actual: se corrige la sesión si no coincide
            (async () => {
                try {
                    const res = await fetch(API_BASE + '/api/profile/me', {
                        headers: { Accept: 'application/json', 'X-Username': userData.username }
                    });
                    if (!res.ok) return;
                    const me = await res.json();
                    if (me.avatar) {
                        if (me.avatar === userData.avatar) return;
                        userData.avatar = me.avatar;
                        delete userData.avatar_fallbacks;
                    } else if (localAvatar(userData.avatar)) {
                        delete userData.avatar; // el servidor ya no lo tiene
                    } else {
                        return;
                    }
                    localStorage.setItem('cardbinder_user', JSON.stringify(userData));
                    renderAvatar(avatarCandidatesFor(userData));
                } catch (e) { /* sin servidor: se queda lo que hay */ }
            })();

            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('cardbinder_user');
                window.location.href = 'login.html';
            });

            // ==========================================
            // NOTIFICACIONES: solicitudes de amistad y mensajes directos sin ver
            // ==========================================
            const notifBtn = document.getElementById('notif-btn');
            const notifMenu = document.getElementById('notif-menu');
            const notifCount = document.getElementById('notif-count');
            let notifTimer = null;

            function notifRow(name, text, href) {
                const a = document.createElement('a');
                a.href = href;
                a.className = 'block bg-[#0f0a06] p-2 rounded-lg border border-[#b39258]/60 hover:bg-[#2c1d0f] transition-colors';
                const p1 = document.createElement('p');
                p1.className = 'text-sm font-bold text-amber-100 truncate';
                p1.textContent = name;
                const p2 = document.createElement('p');
                p2.className = 'text-xs text-amber-200/70';
                p2.textContent = text;
                a.append(p1, p2);
                return a;
            }

            function setNotifOpen(open) {
                notifMenu.classList.toggle('hidden', !open);
                notifBtn.setAttribute('aria-expanded', String(open));
            }

            function renderNotifications(n) {
                notifCount.textContent = n.total > 99 ? '99+' : String(n.total);
                notifCount.classList.toggle('hidden', !n.total);
                notifCount.classList.toggle('flex', !!n.total);
                const rows = [
                    ...n.requests.map((u) => notifRow(u.username, '👥 Quiere ser tu amigo', 'profile.html#solicitudes')),
                    ...n.messages.map((m) => notifRow(m.username,
                        '💬 ' + (m.count === 1 ? '1 mensaje nuevo' : m.count + ' mensajes nuevos'),
                        'profile.html#chat=' + encodeURIComponent(m.username))),
                ];
                if (!rows.length) {
                    const empty = document.createElement('p');
                    empty.className = 'text-xs text-amber-200/60 italic';
                    empty.textContent = 'No tienes notificaciones.';
                    rows.push(empty);
                }
                notifMenu.replaceChildren(...rows);
            }

            async function loadNotifications() {
                try {
                    const res = await fetch(API_BASE + '/api/social/notifications', {
                        headers: { Accept: 'application/json', 'X-Username': userData.username }
                    });
                    if (res.status === 401) { clearInterval(notifTimer); return; }
                    if (res.ok) renderNotifications(await res.json());
                } catch (e) { /* sin servidor: la campana se queda como está */ }
            }

            notifBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                setNotifOpen(notifMenu.classList.contains('hidden'));
            });
            notifMenu.addEventListener('click', (e) => e.stopPropagation());
            document.addEventListener('click', () => setNotifOpen(false));
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setNotifOpen(false); });

            loadNotifications();
            notifTimer = setInterval(() => { if (!document.hidden) loadNotifications(); }, 10000);

            // ==========================================
            // PANEL DE MEDALLAS
            // ==========================================
            const achievementsPanel = document.getElementById('achievements-panel');
            const achievementsGrid = document.getElementById('achievements-grid');
            const achievementsSummary = document.getElementById('achievements-summary');

            function fetchAchievements(usernameHeader) {
                return fetch(`${API_BASE}/api/achievements/`, {
                    headers: { 'X-Username': usernameHeader }
                });
            }

            function showAchievementsMessage(text, isError) {
                achievementsSummary.textContent = '';
                achievementsGrid.innerHTML = '';
                const span = document.createElement('span');
                span.className = 'medal-msg' + (isError ? ' medal-msg-error' : '');
                span.textContent = text;
                achievementsGrid.appendChild(span);
            }

            function renderAchievements(data) {
                const list = data.achievements || [];
                const unlockedCount = list.filter(a => a.unlocked).length;
                achievementsSummary.textContent = `${unlockedCount}/${list.length} desbloqueadas`;
                achievementsGrid.innerHTML = list.map(a => {
                    const pct = a.target ? Math.round((a.progress / a.target) * 100) : 0;
                    const state = a.unlocked ? '¡Conseguida!' : `Progreso: ${a.progress}/${a.target}`;
                    return `
                        <div class="medal ${a.unlocked ? 'unlocked' : 'locked'}">
                            <div class="medal-body">
                                <div class="medal-icon">${escapeHtml(a.icon)}</div>
                                <div class="medal-name">${escapeHtml(a.name)}</div>
                                <div class="medal-bar"><div class="medal-bar-fill" style="width:${pct}%"></div></div>
                                <div class="medal-progress">${a.progress}/${a.target}</div>
                            </div>
                            <div class="medal-tip">
                                <span class="medal-tip-name">${escapeHtml(a.name)}</span>
                                <span class="medal-tip-desc">${escapeHtml(a.description)}</span>
                                <span class="medal-tip-state">${escapeHtml(state)}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            async function loadAchievements() {
                showAchievementsMessage('Cargando medallas...', false);
                try {
                    let res = await fetchAchievements(userData.username);
                    // Si el backend no reconoce el username, probamos con el login de 42
                    if (res.status === 401 && userData.user_login && userData.user_login !== userData.username) {
                        res = await fetchAchievements(userData.user_login);
                    }
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    renderAchievements(await res.json());
                } catch (error) {
                    console.error('Error cargando medallas:', error);
                    showAchievementsMessage('No se pudieron cargar las medallas.', true);
                }
            }

            document.getElementById('profile-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                const willOpen = achievementsPanel.classList.contains('hidden');
                achievementsPanel.classList.toggle('hidden');
                if (willOpen) loadAchievements();
            });

            // Cerrar el panel al hacer clic fuera de él
            document.addEventListener('click', (e) => {
                if (!achievementsPanel.classList.contains('hidden') &&
                    !achievementsPanel.contains(e.target) &&
                    !userMenuContainer.contains(e.target)) {
                    achievementsPanel.classList.add('hidden');
                }
            });
        }

    });

    // ==========================================
    // SALA DE CHAT GLOBAL (WEBSOCKET) Y GIPHY
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
        const chatToggleBtn = document.getElementById('chat-toggle-btn');
        const chatBox = document.getElementById('chat-box');
        const chatCloseBtn = document.getElementById('chat-close-btn');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const messagesContainer = document.getElementById('chat-messages');

        // Elementos de Giphy
        const stickerToggleBtn = document.getElementById('sticker-toggle-btn');
        const stickerPicker = document.getElementById('sticker-picker');
        const giphySearchInput = document.getElementById('giphy-search-input');
        const giphyResults = document.getElementById('giphy-results');

        let ws = null;
        let historyLoaded = false;
        let searchTimeout = null;

        if (!chatToggleBtn || !chatBox) return;

        chatToggleBtn.addEventListener('click', () => {
            const isHidden = chatBox.classList.contains('hidden');
            if (isHidden) {
                chatBox.classList.remove('hidden');
                chatBox.classList.add('flex');
                if (!historyLoaded) {
                    loadChatHistory();
                    historyLoaded = true;
                }
                connectChatWebSocket();
                scrollToBottom();
            } else {
                chatBox.classList.remove('flex');
                chatBox.classList.add('hidden');
            }
        });

        chatCloseBtn.addEventListener('click', () => {
            chatBox.classList.remove('flex');
            chatBox.classList.add('hidden');
            if (stickerPicker) stickerPicker.classList.add('hidden');
        });

        // ==========================================
        // GESTIÓN DEL BUSCADOR DE GIPHY
        // ==========================================
        if (stickerToggleBtn && stickerPicker && giphySearchInput) {
            stickerToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                stickerPicker.classList.toggle('hidden');
                if (!stickerPicker.classList.contains('hidden')) {
                    giphySearchInput.focus();
                }
            });

            stickerPicker.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            document.addEventListener('click', () => {
                stickerPicker.classList.add('hidden');
            });

            giphySearchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                clearTimeout(searchTimeout);

                if (!query) {
                    giphyResults.innerHTML = '<span class="text-[10px] text-amber-200/50 col-span-3 text-center py-4">Escribe algo para buscar...</span>';
                    return;
                }

                searchTimeout = setTimeout(async () => {
                    try {
                        giphyResults.innerHTML = '<span class="text-[10px] text-amber-200 col-span-3 text-center py-4">Buscando...</span>';
                        
                        // API Key personal y soporte de idioma en español
                        const response = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=uYe3zQDwYQ8ZaDrzjdbgSr5Uwm3TOZ6O&q=${encodeURIComponent(query)}&limit=9&lang=es`);
                        const data = await response.json();

                        if (!data.data || data.data.length === 0) {
                            giphyResults.innerHTML = '<span class="text-[10px] text-amber-200/50 col-span-3 text-center py-4">No se encontraron GIFs</span>';
                            return;
                        }

                        giphyResults.innerHTML = '';
                        data.data.forEach(gif => {
                            const imgUrl = gif.images.fixed_height_small.url;
                            const btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'hover:scale-105 transition-transform overflow-hidden rounded cursor-pointer h-16 bg-[#140e09] border border-[#b39258]/30';
                            btn.innerHTML = `<img src="${imgUrl}" class="w-full h-full object-cover" alt="GIF"/>`;
                            
                            btn.addEventListener('click', () => {
                                sendGifMessage(imgUrl);
                            });

                            giphyResults.appendChild(btn);
                        });
                    } catch (err) {
                        console.error('Error buscando en Giphy:', err);
                        giphyResults.innerHTML = '<span class="text-[10px] text-red-400 col-span-3 text-center py-4">Error de conexión</span>';
                    }
                }, 400);
            });
        }

        function sendGifMessage(gifUrl) {
            const storedUser = localStorage.getItem('cardbinder_user');
            let currentUser = { username: 'Conjurador', user_login: 'guest', badge: 'civil_homebrewer' };

            if (storedUser) {
                try { currentUser = JSON.parse(storedUser); } catch (e) {}
            }

            const payload = {
                username: currentUser.username || 'Conjurador',
                user_login: currentUser.user_login || 'guest',
                badge_type: currentUser.badge || 'civil_homebrewer',
                message: `<img src="${gifUrl}" class="w-28 h-28 object-cover rounded-lg mt-1 inline-block shadow-md" alt="Sticker"/>`
            };

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
                stickerPicker.classList.add('hidden');
                giphySearchInput.value = '';
                giphyResults.innerHTML = '<span class="text-[10px] text-amber-200/50 col-span-3 text-center py-4">Escribe algo para buscar...</span>';
            } else {
                alert('No hay conexión activa con el servidor de chat.');
            }
        }

        async function loadChatHistory() {
            try {
                const response = await fetch('http://localhost:8000/api/chat/history');
                if (!response.ok) throw new Error('Error al cargar historial');
                const messages = await response.json();
                messages.forEach(msg => appendChatMessage(msg));
            } catch (error) {
                console.error('❌ Error cargando historial del chat:', error);
            }
        }

        function connectChatWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            ws = new WebSocket('ws://localhost:8000/api/chat/ws/chat');

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                appendChatMessage(data);
            };

            ws.onclose = () => {
                console.log('🔌 Desconectado del chat global. Reintentando en 3s...');
                setTimeout(connectChatWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('❌ Error en WebSocket de chat:', error);
            };
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            const storedUser = localStorage.getItem('cardbinder_user');
            let currentUser = { username: 'Conjurador', user_login: 'guest', badge: 'civil_homebrewer' };

            if (storedUser) {
                try {
                    currentUser = JSON.parse(storedUser);
                } catch (err) {
                    console.error('Error leyendo usuario para el chat', err);
                }
            }

            const payload = {
                username: currentUser.username || 'Conjurador',
                user_login: currentUser.user_login || currentUser.username || 'guest',
                badge_type: currentUser.badge || 'civil_homebrewer',
                message: text
            };

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
                chatInput.value = '';
            } else {
                alert('No hay conexión activa con el servidor de chat.');
            }
        });

        function appendChatMessage(data) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'bg-[#140e09] border border-[#b39258]/30 rounded-xl p-2.5 shadow-sm';

            const timeStr = new Date(data.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const isHtmlMessage = data.message && data.message.includes('<img');
            const contentRendered = isHtmlMessage ? data.message : escapeHtml(data.message);

            msgDiv.innerHTML = `
                <div class="flex justify-between items-center text-[11px] text-amber-400 mb-1">
                    <span class="font-bold">👤 ${escapeHtml(data.username)}</span>
                    <span class="text-amber-200/50">${timeStr}</span>
                </div>
                <div class="text-amber-100 text-xs break-words font-sans">${contentRendered}</div>
            `;

            messagesContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    });
    </script>
</body>
</html>
