services:
  postgres_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --log-level info
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - AVATAR_DIR=/data/avatars
    volumes:
      - avatars:/data/avatars
      - ./data:/app/data:ro
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "from backend.database import get_db_connection; conn = get_db_connection(); conn.close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./data/emergency-assets:/usr/share/nginx/html/emergency-cards:ro
    depends_on:
      - backend

volumes:
  pgdata:
  avatars:
