<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Contenedores - Card Binder Pro</title>
    <link rel="stylesheet" href="public/styles.css"> <!-- O tus estilos globales -->
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .container-form-box { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #94a3b8; }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid #475569; }
        .dynamic-fields { display: none; }
        .dynamic-fields.active { display: block; }
        button.btn-primary { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        button.btn-primary:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div class="container-form-box">
        <h2>Crear Nuevo Contenedor</h2>
        <form id="createContainerForm">
            <div class="form-group">
                <label for="containerName">Nombre del Contenedor</label>
                <input type="text" id="containerName" required placeholder="Ej. Binder Principal, Mazo Modern Mono-R...">
            </div>

            <div class="form-group">
                <label for="containerType">Tipo de Contenedor</label>
                <select id="containerType" required>
                    <option value="">Selecciona un tipo...</option>
                    <option value="binder">Archivador / Binder (Páginas y huecos)</option>
                    <option value="deck">Mazo / Deck (Principal + Banquillo)</option>
                    <option value="box">Caja de Almacenaje (Capacidad libre)</option>
                </select>
            </div>

            <!-- Campos específicos para Binder -->
            <div id="binderFields" class="dynamic-fields">
                <div class="form-group">
                    <label for="binderSize">Tamaño / Estructura del Binder</label>
                    <select id="binderSize">
                        <option value="binder_m" selected>Binder Mediano (3x3 - 9 huecos por página)</option>
                        <option value="binder_s">Binder Pequeño (2x2 - 4 huecos por página)</option>
                        <option value="binder_l">Binder Grande (4x3 - 12 huecos por página)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="binderPages">Número de Páginas / Hojas</label>
                    <input type="number" id="binderPages" value="40" placeholder="Ej. 40 (para 360 huecos)">
                </div>
            </div>

            <!-- Campos específicos para Deck -->
            <div id="deckFields" class="dynamic-fields">
                <div class="form-group">
                    <label for="deckMainCapacity">Tamaño Mazo Principal</label>
                    <input type="number" id="deckMainCapacity" value="60" placeholder="Ej. 60 o 100">
                </div>
                <div class="form-group">
                    <label for="deckSideboardCapacity">Tamaño Reserva / Banquillo / Comandantes</label>
                    <input type="number" id="deckSideboardCapacity" value="15" placeholder="Ej. 15">
                </div>
            </div>

            <!-- Campos específicos para Box -->
            <div id="boxFields" class="dynamic-fields">
                <div class="form-group">
                    <label for="boxCapacity">Capacidad Aproximada de Cartas</label>
                    <input type="number" id="boxCapacity" value="1000" placeholder="Ej. 1000">
                </div>
            </div>

            <button type="submit" class="btn-primary">Guardar Contenedor</button>
        </form>
    </div>

    <script>
        const containerTypeSelect = document.getElementById('containerType');
        const binderFields = document.getElementById('binderFields');
        const deckFields = document.getElementById('deckFields');
        const boxFields = document.getElementById('boxFields');
        const form = document.getElementById('createContainerForm');

        // Mostrar u ocultar campos según el tipo seleccionado
        containerTypeSelect.addEventListener('change', (e) => {
            const type = e.target.value;
            
            binderFields.classList.remove('active');
            deckFields.classList.remove('active');
            boxFields.classList.remove('active');

            if (type === 'binder') {
                binderFields.classList.add('active');
            } else if (type === 'deck') {
                deckFields.classList.add('active');
            } else if (type === 'box') {
                boxFields.classList.add('active');
            }
        });

        // Enviar datos al backend
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('containerName').value.trim();
            const baseType = containerTypeSelect.value;
            
            let type = baseType;
            let max_capacity = null;
            let slots_per_page = 9; 
            let total_pages = null;   
            let sideboard_capacity = null;

            if (baseType === 'binder') {
                // Obtenemos la variante exacta seleccionada (binder_s, binder_m, binder_l)
                type = document.getElementById('binderSize').value; 
                total_pages = parseInt(document.getElementById('binderPages').value) || 40;
                
                if (type === 'binder_s') {
                    slots_per_page = 4;
                } else if (type === 'binder_l') {
                    slots_per_page = 12;
                } else {
                    slots_per_page = 9; // binder_m por defecto
                }

                max_capacity = total_pages * slots_per_page;
            } else if (baseType === 'deck') {
                max_capacity = parseInt(document.getElementById('deckMainCapacity').value) || 60;
                sideboard_capacity = parseInt(document.getElementById('deckSideboardCapacity').value) || 15;
            } else if (baseType === 'box') {
                max_capacity = parseInt(document.getElementById('boxCapacity').value) || 1000;
            }

            try {
                const response = await fetch('http://localhost:8000/api/containers/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name, 
                        type,                  // Envia 'binder_s', 'binder_m' o 'binder_l'
                        max_capacity, 
                        slots_per_page,   
                        total_pages,      
                        sideboard_capacity 
                    })
                });

                if (!response.ok) {
                    throw new Error('Error al registrar el contenedor');
                }

                const result = await response.json();
                alert(`¡Contenedor "${result.name}" creado con éxito!`);
                form.reset();
                binderFields.classList.remove('active');
                deckFields.classList.remove('active');
                boxFields.classList.remove('active');

            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un error al crear el contenedor.");
            }
        });
    </script>
</body>
</html>
