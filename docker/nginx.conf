# WebSocket: si el cliente pide "Upgrade", se reenvía; si no, la conexión se cierra normal
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP (8080): todos los hosts se redirigen a HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# HTTPS (8443 fuera del contenedor)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuración limpia para evitar bucles en la SPA de React
    location /pong {
        alias /usr/share/nginx/html/pong/;
        try_files $uri $uri/ /pong/index.html;
    }

    # Imágenes incluidas solo en el paquete de emergencia (same-origin y offline).
    location /emergency-cards/ {
        alias /usr/share/nginx/html/emergency-cards/;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        # $http_host conserva el puerto; con $host se perdía y el login con 42 apuntaba a un sitio incorrecto
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (chat, salas, Pong) a través de nginx
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
