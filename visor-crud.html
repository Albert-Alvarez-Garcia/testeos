<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión y Visor - Card Binder</title>
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="visor.css">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: var(--text-main);
            font-family: inherit;
        }
        .admin-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .admin-panel h2 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        .search-bar-container {
            display: flex;
            gap: 0.5rem;
        }
        .search-bar-container input {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-app);
            color: var(--text-main);
            font-family: inherit;
        }
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-app);
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .result-item span {
            font-size: 0.9rem;
        }
        .action-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="admin-layout">
        <!-- Panel 1: Búsqueda y Filtrado Local -->
        <div class="admin-panel">
            <h2>🔍 Búsqueda en Base de Datos Local</h2>
            <div class="search-bar-container">
                <input type="text" id="searchInput" placeholder="Escribe para buscar por nombre...">
                <button id="searchBtn" class="visor-mode-btn">Buscar</button>
            </div>
            <div class="results-list" id="resultsList">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Realiza una búsqueda para ver resultados...</p>
            </div>
        </div>

        <!-- Panel 2: Adición de Cartas (Scryfall o Manual) -->
        <div class="admin-panel">
            <h2>➕ Añadir Carta a la Base de Datos</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Próximamente: formulario de importación.</p>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('preferred-mana-theme') || 'default';
            document.documentElement.setAttribute('data-theme', savedTheme);
        });
    </script>
</body>
</html>
