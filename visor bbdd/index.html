<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Binder Pro — Workspace</title>
    <link rel="stylesheet" href="themes.css">
    <style>
        /* Estilos específicos para la capa de inspección en la grid */
        .card-image-wrapper {
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .inspect-overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 15, 18, 0.85);
            color: var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(2px);
        }

        .card-image-wrapper:hover .inspect-overlay {
            opacity: 1;
        }
    </style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="Magicthegathering-logo(1).svg" alt="Magic: The Gathering Logo">
    <span class="app-subtitle">Binder Pro</span>
  </div>

  <div class="theme-selector">
    <label for="themeSelect">Color de Maná:</label>
    <select id="themeSelect" onchange="changeTheme(this.value)" aria-label="Seleccionar tema de maná">
      <option value="default">✨ Clásico / Neutro (Default)</option>
      <option value="blue">🔵 Éter Azul (Island)</option>
      <option value="white">⚪ Pergamino Blanco (Plains)</option>
      <option value="black">⚫ Sombra Negra (Swamp)</option>
      <option value="red">🔴 Fuego Rojo (Mountain)</option>
      <option value="green">🟢 Esencia Verde (Forest)</option>
    </select>
  </div>
</header>

<main>
  <div class="card-grid" id="cardGrid">
    <!-- Carta 1: Betor (Dinámica desde Scryfall) -->
    <article class="card-item" data-scryfall-name="Lightning Bolt" onclick="abrirVisor(this)">
      <div class="card-image-wrapper">
        <img class="api-card-img" src="" alt="Betor, Kin to All" loading="lazy">
        <div class="inspect-overlay">🔍 Pulsa para inspeccionar</div>
      </div>
      <div class="card-content">
        <span class="card-type">Cargando tipo...</span>
        <h2 class="card-title">Betor, Kin to All</h2>
        <p class="card-desc">Cargando texto de reglas...</p>
      </div>
    </article>

    <!-- Carta 2: Buster Sword -->
    <article class="card-item" data-scryfall-name="Counterspell" onclick="abrirVisor(this)">
      <div class="card-image-wrapper">
        <img class="api-card-img" src="" alt="Buster Sword" loading="lazy">
        <div class="inspect-overlay">🔍 Pulsa para inspeccionar</div>
      </div>
      <div class="card-content">
        <span class="card-type">Cargando tipo...</span>
        <h2 class="card-title">Buster Sword</h2>
        <p class="card-desc">Cargando texto de reglas...</p>
      </div>
    </article>

    <!-- Carta 3: Engrampacráneo -->
    <article class="card-item" data-scryfall-name="Dark Ritual" onclick="abrirVisor(this)">
      <div class="card-image-wrapper">
        <img class="api-card-img" src="" alt="Engrampacráneo" loading="lazy">
        <div class="inspect-overlay">🔍 Pulsa para inspeccionar</div>
      </div>
      <div class="card-content">
        <span class="card-type">Cargando tipo...</span>
        <h2 class="card-title">Engrampacráneo</h2>
        <p class="card-desc">Cargando texto de reglas...</p>
      </div>
    </article>
  </div>
</main>

<script>
  function changeTheme(themeName) {
    document.documentElement.setAttribute('data-theme', themeName);
    localStorage.setItem('preferred-mana-theme', themeName);
  }

  // Cargar la preferencia de tema al iniciar y lanzar la conexión con Scryfall
  window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('preferred-mana-theme') || 'default';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeSelect').value = savedTheme;

    // Inicializar la carga de datos desde Scryfall para las cartas de la rejilla
    inicializarCartasScryfall();
  });

  async function inicializarCartasScryfall() {
    const cardItems = document.querySelectorAll('.card-item');

    cardItems.forEach(async (item) => {
      const cardName = item.getAttribute('data-scryfall-name');
      const imgElement = item.querySelector('.api-card-img');
      const typeElement = item.querySelector('.card-type');
      const titleElement = item.querySelector('.card-title');
      const descElement = item.querySelector('.card-desc');

      try {
        const response = await fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(cardName)}`);
        if (!response.ok) throw new Error('No se pudo encontrar la carta');

        const data = await response.json();

        // Guardamos el ID único de Scryfall en el elemento
        item.setAttribute('data-card-id', data.id);

        // Imagen
        const imageUrl = data.image_uris ? data.image_uris.normal : data.card_faces[0].image_uris.normal;
        imgElement.src = imageUrl;

        // Metadatos
        typeElement.textContent = data.type_line;
        titleElement.textContent = data.name;
        descElement.textContent = data.oracle_text || (data.card_faces ? data.card_faces[0].oracle_text : '');

      } catch (error) {
        console.error(`Error cargando la carta ${cardName}:`, error);
        descElement.textContent = "Error al conectar con la base de datos de cartas.";
      }
    });
  }

  // Guardar ID y redirigir al visor detallado
  function abrirVisor(cardElement) {
    const cardId = cardElement.getAttribute('data-card-id');
    if (!cardId) {
      alert("La carta aún está cargando, espera un segundo.");
      return;
    }
    
    localStorage.setItem('selected-card-id', cardId);
    
    // Abre el visor en una nueva pestaña manteniendo la página principal intacta
    window.open(`visor.html?id=${cardId}`, '_blank');
  }
</script>

</body>
</html>
